<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Minecraft 整合包任务书汉化索引：查一个整合包的任务书是自带中文、本站已产出、还是社区已有汉化，并直接拿到补丁。">
<meta name="color-scheme" content="light dark">
<title>整合包任务书汉化索引</title>
<script>
/* 主题在首次绘制前定好，避免闪白/闪黑。三态：auto（跟随系统）/ light / dark */
(function () {
  try {
    var t = localStorage.getItem("quest-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style>
/* ==========================================================================
   整合包任务书汉化索引
   --------------------------------------------------------------------------
   视觉主张：这不是一个「什么都做成物品栏格子」的网站，而是一张**服务器列表**。
   玩家真正要做的事是「扫一眼认出这个包」，所以：

     · 一个容器 + 内部分隔线，而不是 60 个各自描边的盒子（层级靠结构，不靠阴影）
     · 斜角（MC 的立体感）只留给「能被按下/能拿走」的东西：按钮、选中的筛子、卡片
     · 配色只表达状态：绿=有汉化，琥珀=还没译，灰蓝=没有任务书。选中态靠「按下去」而不是换色
     · 正文用无衬线（中文可读），等宽只给数据：版本号、下载量、语言布局、slug
     · 封面 112px 起——整合包封面是识别入口，不是装饰
   ========================================================================== */

/* ---------- 令牌 ---------- */
:root {
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas,
          "Sarasa Mono SC", "Noto Sans Mono CJK SC", "MS Gothic", monospace;

  --w: 1240px;

  /* 白昼地表：暖石底 + 亮面板 */
  --canvas:    #b8b4aa;
  --canvas-2:  #a8a49a;
  --panel:     #e3e0d8;
  --panel-2:   #d5d1c8;
  --row:       #dbd7ce;
  --row-hi:    #eae7df;
  --slot:      #c7c3b9;
  --slot-2:    #b7b3a9;

  --edge:      #191815;
  --line:      rgba(25, 24, 21, .16);
  --grid:      rgba(25, 24, 21, .07);
  --line-2:    rgba(25, 24, 21, .30);
  --bevel-l:   #fdfcf8;
  --bevel-d:   #918d83;

  --ink:       #1b1a17;
  --ink-2:     #4c4941;
  --ink-3:     #5c5850;

  --grass:     #5f9e3a;
  --grass-2:   #3f7226;
  --dirt:      #8a6242;
  --dirt-2:    #5e422c;
  --lapis:     #1f4f9c;

  /* 状态：tag = 实色标签，ink = 同色系的正文色（都过 4.5:1） */
  --zh-bg:   #27682c;  --zh-fg:   #ffffff;  --zh-ink:   #23602a;
  --unzh-bg: #a2731a;  --unzh-fg: #1a1405;  --unzh-ink: #775010;
  --noftb-bg:#565a61;  --noftb-fg:#ffffff;  --noftb-ink:#4a4e55;
  --notext-bg:#4a5878; --notext-fg:#ffffff; --notext-ink:#414f6e;

  --focus:     #1f4f9c;
  --shadow:    0 2px 0 rgba(25, 24, 21, .18);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas:    #0f1115;
    --canvas-2:  #090a0d;
    --panel:     #1a1e25;
    --panel-2:   #222731;
    --row:       #1f242c;
    --row-hi:    #272d38;
    --slot:      #14181e;
    --slot-2:    #0d1014;

    --edge:      #000000;
    --line:      rgba(255, 255, 255, .10);
    --grid:      rgba(255, 255, 255, .035);
    --line-2:    rgba(255, 255, 255, .22);
    --bevel-l:   #3a4150;
    --bevel-d:   #05060a;

    --ink:       #ece9e3;
    --ink-2:     #b9b5ae;
    --ink-3:     #94908a;

    --grass:     #4e8a35;
    --grass-2:   #37662a;
    --dirt:      #3a2e22;
    --dirt-2:    #241c15;
    --lapis:     #8fb4ff;

    --zh-bg:   #2f7d32;  --zh-fg:   #f2fff0;  --zh-ink:   #7fd162;
    --unzh-bg: #a2731a;  --unzh-fg: #1a1405;  --unzh-ink: #e8b353;
    --noftb-bg:#3d424a;  --noftb-fg:#e8e6e1;  --noftb-ink:#9aa0a8;
    --notext-bg:#39445c; --notext-fg:#e8eaf2; --notext-ink:#9db0d8;

    --focus:     #8fb4ff;
    --shadow:    0 2px 0 rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --canvas:    #0f1115;
  --canvas-2:  #090a0d;
  --panel:     #1a1e25;
  --panel-2:   #222731;
  --row:       #1f242c;
  --row-hi:    #272d38;
  --slot:      #14181e;
  --slot-2:    #0d1014;

  --edge:      #000000;
  --line:      rgba(255, 255, 255, .10);
  --grid:      rgba(255, 255, 255, .035);
  --line-2:    rgba(255, 255, 255, .22);
  --bevel-l:   #3a4150;
  --bevel-d:   #05060a;

  --ink:       #ece9e3;
  --ink-2:     #b9b5ae;
  --ink-3:     #94908a;

  --grass:     #4e8a35;
  --grass-2:   #37662a;
  --dirt:      #3a2e22;
  --dirt-2:    #241c15;
  --lapis:     #8fb4ff;

  --zh-bg:   #2f7d32;  --zh-fg:   #f2fff0;  --zh-ink:   #7fd162;
  --unzh-bg: #a2731a;  --unzh-fg: #1a1405;  --unzh-ink: #e8b353;
  --noftb-bg:#3d424a;  --noftb-fg:#e8e6e1;  --noftb-ink:#9aa0a8;
  --notext-bg:#39445c; --notext-fg:#e8eaf2; --notext-ink:#9db0d8;

  --focus:     #8fb4ff;
  --shadow:    0 2px 0 rgba(0, 0, 0, .5);
}

/* ---------- 基座 ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: 76px;
}

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  background-color: var(--canvas);
  /* 16px 方块网：只在画布上，正文面板是不透明的 */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px, 16px 16px;
  background-position: 0 0, 0 0;
  background-blend-mode: normal;
  min-height: 100vh;
}

::selection { background: var(--grass-2); color: #fff; }

a { color: var(--lapis); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.ic { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -.18em; fill: currentColor; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 99;
  background: var(--grass); color: #fff; padding: 10px 16px; font-weight: 700;
}
.skip:focus { left: 8px; top: 8px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 材质：只两处用斜面 ---------- */
/* L1 框架：大的功能区块 */
.panel {
  background: var(--panel);
  box-shadow:
    0 0 0 1px var(--edge),
    inset 2px 2px 0 0 var(--bevel-l),
    inset -2px -2px 0 0 var(--bevel-d);
}
/* L2 可按下：按钮 / 卡片 / 选中的筛子 */
.press {
  box-shadow:
    0 0 0 1px var(--edge),
    inset 2px 2px 0 0 var(--bevel-l),
    inset -2px -2px 0 0 var(--bevel-d),
    var(--shadow);
}
.press:active {
  box-shadow:
    0 0 0 1px var(--edge),
    inset 2px 2px 0 0 var(--bevel-d),
    inset -2px -2px 0 0 var(--bevel-l);
}

/* ---------- 顶栏 ---------- */
.site-head {
  position: sticky; top: 0; z-index: 30;
  background-color: var(--dirt-2);
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 8px),
    linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.42));
  border-bottom: 1px solid #000;
  box-shadow: 0 3px 0 rgba(0,0,0,.35);
}
.site-head .inner {
  max-width: var(--w); margin: 0 auto; padding: 0 18px;
  min-height: 58px; display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: #fff; flex: none; }
.brand-mark {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  background: var(--grass);
  box-shadow: 0 0 0 2px #000, inset 2px 2px 0 rgba(255,255,255,.45), inset -2px -2px 0 rgba(0,0,0,.4);
  color: #12200c;
}
.brand-mark .ic { width: 20px; height: 20px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.brand-text small {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  color: rgba(255,255,255,.55); text-transform: uppercase;
}

.nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.nav a {
  font-size: 13px; color: rgba(255,255,255,.72); text-decoration: none;
  padding: 7px 11px; border-radius: 0; white-space: nowrap;
  box-shadow: inset 0 0 0 0 transparent;
}
.nav a:hover { color: #fff; background: rgba(0,0,0,.28); }
.nav a[aria-current="page"] {
  color: #fff; font-weight: 700; background: rgba(0,0,0,.38);
  box-shadow: inset 0 -2px 0 0 var(--grass);
}
.theme-btn {
  font: inherit; cursor: pointer; color: rgba(255,255,255,.8);
  width: 34px; height: 30px; display: grid; place-items: center;
  background: rgba(0,0,0,.3); border: 0; flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
}
.theme-btn:hover { color: #fff; background: rgba(0,0,0,.45); }
.theme-btn .ic { width: 17px; height: 17px; }

/* ---------- 主体 ---------- */
main { max-width: var(--w); margin: 0 auto; padding: 26px 18px 72px; }

h1, h2, h3 { font-family: var(--sans); letter-spacing: .01em; }
h1 { font-size: clamp(21px, 2.5vw, 27px); line-height: 1.32; margin: 0 0 8px; font-weight: 700; }
h2 { font-size: 16px; line-height: 1.4; margin: 0 0 10px; font-weight: 700; }
h3 { font-size: 14px; margin: 0 0 6px; font-weight: 700; }
p { margin: 0 0 12px; max-width: 72ch; }

.mono { font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- 首屏：一句话 + 一条搜索框，不做四格仪表盘 ---------- */
.topbar { padding: 22px 22px 20px; }
.topbar h1 { margin-bottom: 6px; }
.topbar .claim {
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  margin: 0 0 18px; letter-spacing: .01em;
}
.topbar .claim b { color: var(--ink-2); font-weight: 700; }
.topbar .claim i { font-style: normal; color: var(--ink-3); opacity: .55; padding: 0 6px; }
.topbar .claim .seg { white-space: nowrap; }

.search { display: flex; gap: 8px; align-items: stretch; }
.search-field {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 12px; background: var(--slot);
  box-shadow: inset 2px 2px 0 0 var(--bevel-d), inset -2px -2px 0 0 var(--bevel-l), 0 0 0 1px var(--line-2);
}
.search-field .ic { color: var(--ink-3); width: 18px; height: 18px; }
.search-field:focus-within { box-shadow: inset 2px 2px 0 0 var(--bevel-d), inset -2px -2px 0 0 var(--bevel-l), 0 0 0 2px var(--focus); }
.search input {
  font: inherit; font-size: 15px; color: var(--ink); background: transparent;
  border: 0; outline: 0; width: 100%; padding: 15px 0; min-width: 0;
}
.search input::placeholder { color: var(--ink-3); }
.search .btn { padding-inline: 18px; }

input[type="text"], input[type="url"], input[type="email"], input[type="password"], textarea, select {
  font: inherit; color: var(--ink); background: transparent; border: 0; outline: 0;
  width: 100%; min-width: 0;
}
.search-hint {
  margin: 10px 0 0; font-size: 11.5px; font-family: var(--mono); color: var(--ink-3);
}
.search-hint kbd {
  font: inherit; padding: 1px 5px; color: var(--ink-2);
  box-shadow: inset 0 0 0 1px var(--line-2);
}

/* ---------- 工具栏：筛子 + 下拉 + 视图 ---------- */
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 18px 0 12px;
}
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 10px 6px 8px; color: var(--ink-2); background: transparent; border: 0;
  box-shadow: inset 0 0 0 1px var(--line-2);
}
.chip:hover { color: var(--ink); background: rgba(127,127,127,.12); }
.chip .dot { width: 7px; height: 7px; flex: none; background: var(--st, var(--ink-3)); }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] {
  color: var(--ink); font-weight: 700; background: var(--panel);
  box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-d), inset -2px -2px 0 0 var(--bevel-l);
}
.chip[aria-pressed="true"] .n { color: var(--ink-2); }

.tools { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.sel {
  position: relative; display: inline-flex; align-items: center;
  background: var(--panel); box-shadow: 0 0 0 1px var(--line-2);
}
.sel select {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); cursor: pointer;
  appearance: none; padding: 7px 26px 7px 9px; width: auto;
}
.sel::after {
  content: ""; position: absolute; right: 9px; top: 50%; width: 0; height: 0; pointer-events: none;
  border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
  border-top: 4px solid var(--ink-3); transform: translateY(-1px);
}
.sel:hover { background: var(--panel-2); }
.viewtoggle { display: inline-flex; gap: 4px; }
.viewtoggle button {
  width: 32px; height: 30px; display: grid; place-items: center; cursor: pointer;
  color: var(--ink-3); background: var(--panel); border: 0;
  box-shadow: 0 0 0 1px var(--line-2);
}
.viewtoggle button:hover { color: var(--ink); background: var(--panel-2); }
.viewtoggle button[aria-pressed="true"] {
  color: var(--ink); background: var(--slot);
  box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-d), inset -2px -2px 0 0 var(--bevel-l);
}
.viewtoggle .ic { width: 16px; height: 16px; }

.resultline {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 0 0 10px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
}
.resultline .reset {
  font: inherit; font-family: var(--sans); font-size: 12px; color: var(--lapis);
  background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
  text-underline-offset: 3px; margin-left: auto;
}

/* ---------- 列表容器：一个框，内部分隔线 ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list.rows {
  background: var(--panel);
  box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-l), inset -2px -2px 0 0 var(--bevel-d);
  overflow: hidden;
}
.row { margin: 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.rowhit {
  font: inherit; width: 100%; text-align: left; cursor: pointer; border: 0; background: transparent;
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 16px;
  padding: 10px 16px 10px 12px; color: var(--ink);
}
.rowhit:hover { background: var(--row-hi); }
.rowhit:hover .cover-slot { transform: translateY(-1px); }
.rowhit:active { background: var(--row); }
.rowhit .body { min-width: 0; }
.rowhit .name {
  display: block; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rowhit .meta {
  display: block; margin-top: 3px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rowhit .meta .sep { opacity: .45; padding: 0 5px; }

/* ---------- 封面 ---------- */
.cover-slot {
  position: relative; width: var(--cs, 64px); height: var(--cs, 64px); flex: none;
  display: grid; place-items: center; overflow: hidden;
  background: var(--slot-2);
  box-shadow: inset 0 0 0 1px var(--line-2), inset 2px 2px 0 0 var(--bevel-d);
  transition: transform .12s steps(2, end);
  /* 没图标时的底纹：像一块没放东西的槽 */
  background-image:
    linear-gradient(rgba(127,127,127,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,127,127,.10) 1px, transparent 1px);
  background-size: 8px 8px, 8px 8px;
}
.cover-slot.is-plate { background-color: var(--slot); }
.cover-glyph {
  font-family: var(--mono); font-weight: 700; color: var(--ink-2);
  font-size: calc(var(--cs, 64px) * .30); line-height: 1; letter-spacing: .02em;
  text-shadow: 1px 1px 0 rgba(0,0,0,.25);
}
/* 字母牌底部一条状态色：图片缺失时也能扫出色块分布 */
.cover-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--tag-bg, var(--ink-3)); }
.cover {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  image-rendering: pixelated; object-fit: cover;
}

/* ---------- 画廊 ---------- */
.list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(214px, 100%), 1fr)); gap: 10px; }
.card { margin: 0; min-width: 0; }
.cardhit {
  font: inherit; width: 100%; height: 100%; min-width: 0; cursor: pointer; border: 0;
  display: flex; flex-direction: column; align-items: stretch; gap: 0;
  padding: 14px 14px 12px; text-align: left; color: var(--ink); background: var(--row);
  box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-l), inset -2px -2px 0 0 var(--bevel-d);
  transition: transform .12s steps(2, end), background .12s linear;
}
.cardhit:hover { background: var(--row-hi); transform: translateY(-3px); }
.cardhit:active { transform: translateY(0); box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-d), inset -2px -2px 0 0 var(--bevel-l); }
.cardhit .cover-slot { --cs: 112px; margin: 0 auto 12px; }
.card-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cardhit .name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 14px; font-weight: 600; line-height: 1.38; overflow-wrap: anywhere;
}
.cardhit .meta {
  display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.card-foot .dl { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.cardhit .name { min-height: 2.76em; }

/* ---------- 状态标签 ---------- */
[data-state="zh"]      { --st: var(--zh-ink);     --tag-bg: var(--zh-bg);     --tag-fg: var(--zh-fg); }
[data-state="unzh"]    { --st: var(--unzh-ink);   --tag-bg: var(--unzh-bg);   --tag-fg: var(--unzh-fg); }
[data-state="no-ftb"]  { --st: var(--noftb-ink);  --tag-bg: var(--noftb-bg);  --tag-fg: var(--noftb-fg); }
[data-state="no-text"] { --st: var(--notext-ink); --tag-bg: var(--notext-bg); --tag-fg: var(--notext-fg); }
[data-state="unknown"] { --st: var(--ink-3);      --tag-bg: var(--noftb-bg);  --tag-fg: var(--noftb-fg); }

.tag {
  display: inline-flex; align-items: center;
  font-family: var(--sans); font-size: 11px; font-weight: 700; line-height: 1;
  padding: 5px 7px 6px; white-space: nowrap;
  color: var(--tag-fg); background: var(--tag-bg);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.22), inset -1px -1px 0 rgba(0,0,0,.25);
}
.rowhit .tag { justify-self: end; }

  box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
  margin-left: 6px;
}

}

/* ---------- 分页 ---------- */
.pager { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 16px; }
.pager button {
  font: inherit; font-family: var(--mono); font-size: 12px; cursor: pointer; color: var(--ink-2);
  background: var(--panel); border: 0; padding: 6px 10px; min-width: 30px;
  box-shadow: 0 0 0 1px var(--line-2);
}
.pager button:hover:not(:disabled) { background: var(--panel-2); color: var(--ink); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager button.cur {
  color: var(--zh-fg); background: var(--zh-bg); font-weight: 700;
  box-shadow: 0 0 0 1px var(--edge), inset 1px 1px 0 rgba(255,255,255,.3), inset -1px -1px 0 rgba(0,0,0,.3);
}
.pg-gap { color: var(--ink-3); padding: 0 2px; }

/* ---------- 空状态 ---------- */
.empty {
  padding: 30px 24px; background: var(--panel);

}
.empty h2 { margin-bottom: 6px; }
.empty p { color: var(--ink-2); margin: 0 0 4px; }
.empty .acts { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 按钮 ---------- */
.btn {
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 15px; color: var(--ink); background: var(--panel-2); border: 0;
  box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-l), inset -2px -2px 0 0 var(--bevel-d), var(--shadow);
}
.btn:hover { background: var(--row-hi); color: var(--ink); }
.btn:active { box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 var(--bevel-d), inset -2px -2px 0 0 var(--bevel-l); }
.btn .ic { width: 16px; height: 16px; }

.btn.primary {
  color: var(--zh-fg);
  background: var(--zh-bg);
  box-shadow: 0 0 0 1px var(--edge), inset 2px 2px 0 0 rgba(255,255,255,.26), inset -2px -2px 0 0 rgba(0,0,0,.32), var(--shadow);
}
.btn.primary:hover { filter: brightness(1.1); color: var(--zh-fg); }

.btn.ghost { background: transparent; box-shadow: 0 0 0 1px var(--line-2); color: var(--ink-2); font-weight: 500; }
.btn.ghost:hover { background: rgba(127,127,127,.12); color: var(--ink); }
.btn.is-disabled {
  color: var(--ink-3); background: var(--slot); cursor: not-allowed; opacity: .8;
  box-shadow: 0 0 0 1px var(--line-2), inset 2px 2px 0 0 var(--bevel-d);
}
.btn.sm { font-size: 12px; padding: 7px 11px; }

/* ---------- 详情 ---------- */
.crumbs {
  display: flex; align-items: center; gap: 12px; margin: 0 0 14px;
  font-size: 12.5px; color: var(--ink-3);

.crumbs a {

  padding: 5px 9px; box-shadow: inset 0 0 0 1px var(--line-2);
}
.crumbs a:hover { color: var(--ink); background: var(--panel); }
.crumbs .esc { font-family: var(--mono); font-size: 11px; opacity: .65; }

.sheet {
  display: grid; grid-template-columns: 128px minmax(0, 1fr) 236px; gap: 20px;
  padding: 20px; align-items: start;
}
.sheet .cover-slot { --cs: 128px; }
.sheet h1 { font-size: clamp(19px, 2.2vw, 24px); margin-bottom: 8px; overflow-wrap: anywhere; }
.sheet .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sheet .facts span {
  font-family: var(--mono); font-size: 11px; color: var(--ink-2); padding: 3px 7px;

}
.sheet .desc {
  font-size: 13px; line-height: 1.7; color: var(--ink-3); margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.sheet .desc.open { -webkit-line-clamp: unset; display: block; }
.sheet .desc-more {

.acts-col { display: flex; flex-direction: column; gap: 8px; }
.acts-col .btn { width: 100%; }
.acts-col .note { font-size: 11.5px; color: var(--ink-3); line-height: 1.65; margin: 2px 0 0; }
.acts-col .copy { align-self: flex-start; }

/* 状态条：详情页唯一的高饱和块 */
.status {
  display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 0;
  margin-top: 12px; background: var(--panel);

}

}

.empty-p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }

.acts-col .copy { width: auto; align-self: flex-start; }

details.tech {

code { font-family: var(--mono); font-size: .94em; background: rgba(127,127,127,.18); padding: 1px 5px; }

/* ---------- 关于 ---------- */

  // ---------- 主题：auto / light / dark ----------
  var THEME_KEY = "quest-theme";
  var THEME_ORDER = ["auto", "light", "dark"];
  var THEME_TEXT = { auto: "跟随系统", light: "亮色", dark: "暗色" };
  var THEME_ICON = {

  // ---------- 归一化搜索 ----------
  // 中文原样保留（玩家会输入「石头世界」这类中文名），英文做小写与去符号
  function norm(s) {
    return String(s || "").toLowerCase().replace(/[\s\-_:：·.,，。()（）\[\]【】]/g, "");
  }
  // 1764/2057 条记录没有 title / icon / downloads，只有 slug。
  // 直接把 slug 摆出来（stone-in-sky）会让大半个目录看起来像坏数据，
  // 所以统一生成一个可读标题，全站只用 _title。
  var SMALL_WORD = { a: 1, an: 1, and: 1, the: 1, of: 1, to: 1, in: 1, on: 1, for: 1, with: 1, at: 1, by: 1, vs: 1 };
  var ACRONYM = { ftb: 1, atm: 1, mc: 1, tfg: 1, gtnh: 1, bmc: 1, rpg: 1, rlcraft: 1, pvp: 1, rlc: 1, ati: 1, "atm10": 1 };
  function humanize(slug) {
    var words = String(slug || "").split(/[-_]+/).filter(Boolean);
    var out = words.map(function (w, i) {
      var low = w.toLowerCase();
      if (ACRONYM[low]) return low.toUpperCase();
      if (!/[a-z]/.test(low)) return w;                 // 1.20.1 / 4 这类原样
      if (i > 0 && SMALL_WORD[low]) return low;
      return w.charAt(0).toUpperCase() + low.slice(1);
    });
    return out.join(" ") || slug || "未命名";
  }
  function initialsOf(title) {
    var w = String(title || "").split(/\s+/).filter(function (x) { return x && !SMALL_WORD[x.toLowerCase()]; });
    if (w.length >= 2) return (w[0].charAt(0) + w[1].charAt(0)).toUpperCase();
    return String(title || "?").slice(0, 1).toUpperCase();
  }

  PACKS.forEach(function (p) {
    p._title = p.title || humanize(p.slug);
    p._keys = [norm(p.slug), norm(p.title), norm(p._title)];
    if (p.providers && p.providers.length) {
      p._keys.push(norm(p.providers[0].packName));
      if (p.providers[0].packNameZh) p._keys.push(norm(p.providers[0].packNameZh));
    }
    p._keys = p._keys.filter(Boolean);
    p._bySlug = p.slug;
  });
  var BY_SLUG = {};
  PACKS.forEach(function (p) { BY_SLUG[p.slug] = p; });

  function match(q) {
    var n = norm(q);
    if (!n) return [];
    var scored = [];
    for (var i = 0; i < PACKS.length; i++) {
      var p = PACKS[i], best = -1;
      for (var k = 0; k < p._keys.length; k++) {
        var key = p._keys[k];
        var s = -1;
        if (key === n) s = 100;
        else if (key.indexOf(n) === 0) s = 80;
        else if (key.indexOf(n) > -1) s = 60;
        else if (n.indexOf(key) > -1 && key.length >= 4) s = 40;
        if (s > best) best = s;
      }
      if (best > 0) scored.push({ p: p, s: best, d: p.downloads || 0 });
    }
    scored.sort(function (a, b) { return b.s - a.s || b.d - a.d; });
    return scored.map(function (x) { return x.p; });
  }

  // ---------- 筛选分类 ----------
  // 三态分类：主分类只有「已汉化 / 未汉化 / 无 FTB 任务」，外加「无可译文本」。
  // native-zh、embedded、探测失败不再各自占一个分类，改为行内徽章。
  var PROBE_WHY = { nodl: "作者关闭了 API 分发", toobig: "包体超过 400MB" };

  function probeWhy(p) {
    var layout = String(p.layout || "");
    if (PROBE_WHY[layout]) return PROBE_WHY[layout];
    if (layout.indexOf("error") === 0) return "探测请求失败";
    return "探测没能完成";
  }

  var STATE_CAT = {
    "downloadable": "zh",
    "native-zh": "zh",
    "gap-uncovered": "unzh",
    "gap-covered": "unzh",
    "embedded": "unzh",
    "no-quests": "no-ftb",
    "no-text": "no-text"
  };
  var CAT_LABEL = { zh: "已汉化", unzh: "未汉化", "no-ftb": "无 FTB 任务", "no-text": "无可译文本" };

  function classify(p) {
    if (p.probeIncomplete) {
      return {
        cat: "no-ftb", label: CAT_LABEL["no-ftb"], why: probeWhy(p),
        badge: { key: "probe", text: "无法探测" }
      };
    }
    var cat = STATE_CAT[p.state];
    if (!cat) return { cat: null, label: p.stateLabel || "状态未知", badge: null, why: p.stateWhy };
    var badge = null;
    if (p.state === "native-zh") badge = { key: "native", text: "整合包自带" };
    else if (p.state === "embedded") badge = { key: "embedded", text: "内嵌格式" };
    return { cat: cat, label: CAT_LABEL[cat], badge: badge, why: p.stateWhy };
  }

  function badgeHTML(badge) {
    if (!badge) return "";
    return '<span class="tag-badge" data-badge="' + badge.key + '">' + esc(badge.text) + "</span>";
  }
  function tab(p, withBadge) {
    var c = classify(p);
    return '<span class="tag" data-state="' + (c.cat || "unknown") + '">' + esc(c.label)
      + (withBadge === false ? "" : badgeHTML(c.badge)) + "</span>";
  }

  // 封面：没有图时不是空白，而是一块带首字的槽
  function coverSize(p) {
    var glyph = initialsOf(p._title);
    return '<span class="cover-slot' + (p.iconUrl ? "" : " is-plate") + '">'
      + '<span class="cover-glyph" aria-hidden="true">' + esc(glyph) + "</span>"
      + (p.iconUrl ? "" : '<span class="cover-bar" data-state="' + (classify(p).cat || "unknown") + '" aria-hidden="true"></span>')
      + (p.iconUrl
        ? '<img class="cover" src="' + esc(p.iconUrl) + '" alt="" loading="lazy" decoding="async" width="256" height="256">'
        : "")

  // 图片挂了就撤掉 <img>，露出下面的首字，而不是显示破图图标

  // 「适配版本」= 这份汉化是按整合包的哪个版本翻的。
  // 依次取：enrich 核实过的 version → 上游文件发布日期 → 补丁 zip 名里的版本。
  // 都没有就返回 null（页面不写「未知」，旧包不制造噪声）。
  var VERSION_SOURCE_TEXT = {
    manifest: "整合包内 manifest",
    displayName: "上游文件名",
    fileName: "上游文件名",
    "modrinth-version": "Modrinth 版本条目",
    zip: "补丁文件名",
    fileDate: "发布日期"
  };
  // Modrinth 包的上游文件是 .mrpack，补丁名会变成 "<slug>_v1.1.7.mrpack.zip"，
  // 版本串尾巴上会拖着扩展名 —— 显示前统一削掉。
  function cleanVersion(v) {
    return String(v || "").replace(/\.(zip|mrpack|jar)$/i, "");
  }
  function packVersion(p) {
    var sv = p.sourceVersion;
    var text = null, from = null;
    if (sv) {
      if (sv.version && sv.versionSource !== "fileDate") {
        text = cleanVersion(sv.version);
        from = sv.versionSource || "fileName";
      } else if (sv.fileDate) {
        return { text: fmtDate(sv.fileDate), from: "fileDate" };
      }
    }
    if (!text) {
      // sourceVersion 缺失的旧补丁：补丁 zip 名就是 <slug>_v<version>.zip，版本同源
      var zip = p.download && p.download.zip ? String(p.download.zip).split("/").pop() : "";
      var m = zip.match(/_v(\d[\w.]*?)\.zip$/i);
      if (m) { text = cleanVersion(m[1]); from = "zip"; }
    }
    if (!text) return null;
    // 20241009 这种是发布日期被当成版本号，显示成日期更好读
    if (/^\d{8}$/.test(text)) {
      return { text: text.slice(0, 4) + "-" + text.slice(4, 6) + "-" + text.slice(6), from: from };
    }
    return { text: text, from: from };
  }

  // 卡片窄，只放一个 MC 版本；行和详情放到两个
  function metaParts(p, opts) {
    opts = opts || {};
    var out = [];
    if (p.gameVersions && p.gameVersions.length) {
      out.push("MC " + p.gameVersions.slice(0, opts.maxMC || 2).join(" / "));
    }
    if (opts.loader && p.loaders && p.loaders.length) out.push(p.loaders.join(" / "));
    var v = packVersion(p);
    if (v) out.push("适配 " + v.text);
    return out;
  }
  var SEP = '<span class="sep">·</span>';
  function metaShort(p) { return metaParts(p, { maxMC: 1 }).join(SEP); }
  function metaLine(p) {
    var parts = metaParts(p, { loader: true });
    if (p.downloads != null) parts.push(fmtNum(p.downloads).replace(/ /g, "") + " 次下载");
    return parts.length ? parts.join(SEP) : (p.download ? "补丁已产出" : "无上游版本记录");

  function dlCount(p) {

  function cardHTML(p, i) {
    return '<li class="card"><button class="cardhit" type="button" data-slug="' + esc(p.slug) + '">'

  function rowHTML(p, i) {
    return '<li class="row"><button class="rowhit" type="button" data-slug="' + esc(p.slug) + '">'

      + '<span class="meta">' + metaLine(p) + "</span></span>"

  }

  // ---------- 列表状态（可分享、可后退） ----------
  var PAGE_SIZE = 60;
  var S = { q: "", st: "all", ver: "", loader: "", sort: "dl", view: "gallery", page: 0 };
  var lastResults = [];
  var listScroll = 0;

  function renderFilters() {
    var counts = { all: PACKS.length, zh: 0, unzh: 0, "no-ftb": 0, "no-text": 0 };
    PACKS.forEach(function (p) {
      var cat = classify(p).cat;
      if (cat) counts[cat]++;
    });
    var order = [
      ["all", "全部", "var(--ink-3)"],
      ["zh", "已汉化", "var(--zh-ink)"],
      ["unzh", "未汉化", "var(--unzh-ink)"],
      ["no-ftb", "无 FTB 任务", "var(--noftb-ink)"],
      ["no-text", "无可译文本", "var(--notext-ink)"]
    ];
    var html = "";
    order.forEach(function (o) {
      html += '<button type="button" class="chip" data-filter="' + o[0] + '" aria-pressed="' + (S.st === o[0]) + '"'
        + ' style="--st:' + o[2] + '">'
        + '<span class="dot" aria-hidden="true"></span>' + esc(o[1])
        + '<span class="n">' + counts[o[0]] + "</span></button>";
    });
    $("#filters").innerHTML = html;
  }

  // 版本 / 加载器下拉：数据里就有，玩家一定先按「我玩哪个版本」收敛
  function renderSelects() {
    var vers = {}, loaders = {};
    PACKS.forEach(function (p) {
      (p.gameVersions || []).forEach(function (v) { vers[v] = (vers[v] || 0) + 1; });
      (p.loaders || []).forEach(function (l) { loaders[l] = (loaders[l] || 0) + 1; });
    });
    var vk = Object.keys(vers).sort(function (a, b) {
      var na = parseFloat(a), nb = parseFloat(b);
      return nb - na || b.localeCompare(a);
    });
    var lk = Object.keys(loaders).sort(function (a, b) { return loaders[b] - loaders[a]; });
    var vsel = '<option value="">全部版本</option>' + vk.map(function (v) {
      return '<option value="' + esc(v) + '">' + esc(v) + " (" + vers[v] + ")</option>";
    }).join("");
    var lsel = '<option value="">全部加载器</option>' + lk.map(function (l) {
      return '<option value="' + esc(l) + '">' + esc(l) + " (" + loaders[l] + ")</option>";
    }).join("");
    $("#f-ver").innerHTML = vsel;
    $("#f-loader").innerHTML = lsel;
    $("#f-ver").value = S.ver;
    $("#f-loader").value = S.loader;
    $("#f-sort").value = S.sort;
  }

  function computeResults() {
    var base = S.q ? match(S.q) : PACKS.slice();
    if (S.st !== "all") base = base.filter(function (p) { return classify(p).cat === S.st; });
    if (S.ver) base = base.filter(function (p) { return (p.gameVersions || []).indexOf(S.ver) > -1; });
    if (S.loader) base = base.filter(function (p) { return (p.loaders || []).indexOf(S.loader) > -1; });
    if (S.sort === "az") {
      base.sort(function (a, b) {
        return String(a.title || a.slug).localeCompare(String(b.title || b.slug), "zh-Hans-CN");
      });
    } else if (!S.q) {
      base.sort(function (a, b) { return (b.downloads || 0) - (a.downloads || 0); });
    }
    return base;
  }

  function syncedURL() {
    var parts = [];
    if (S.q) parts.push("q=" + encodeURIComponent(S.q));
    if (S.st !== "all") parts.push("st=" + S.st);
    if (S.ver) parts.push("ver=" + encodeURIComponent(S.ver));
    if (S.loader) parts.push("lo=" + encodeURIComponent(S.loader));
    if (S.sort !== "dl") parts.push("sort=" + S.sort);
    if (S.view !== "gallery") parts.push("view=" + S.view);
    if (S.page) parts.push("page=" + (S.page + 1));
    return "#/" + (parts.length ? "?" + parts.join("&") : "");
  }

  function syncURL() {
    if (currentView() !== "search") return;
    var url = syncedURL();
    if (location.hash !== url) {
      try { history.replaceState(history.state, "", url); } catch (e) { location.hash = url.slice(1); }
    }
  }

  function renderList() {
    var results = computeResults();
    lastResults = results;

    var list = $("#list");
    list.className = "list " + (S.view === "gallery" ? "grid" : "rows");

    if (!results.length) {
      list.innerHTML = "";
      $("#pager").innerHTML = "";
      $("#listmeta").textContent = "";
      var hasFilter = S.q || S.st !== "all" || S.ver || S.loader;
      $("#list-empty").innerHTML = S.q
        ? '<div class="empty"><h2>没找到「' + esc(S.q) + "」</h2>"
          + "<p>可能不在扫描范围内（目前覆盖 CurseForge 热度前 10,000 与 Modrinth 热度前列，共 "
          + D.stat.total + " 条记录）。</p>"
          + "<p>换个更短的关键词试试，比如只输名字的前几个词。</p>"
          + '<div class="acts"><button class="btn" type="button" data-clear="q">清空搜索</button>'
          + (hasFilter ? '<button class="btn ghost" type="button" data-clear="all">清空全部条件</button>' : "")
          + "</div></div>"
        : '<div class="empty"><h2>这个组合下没有整合包</h2>'
          + "<p>版本、加载器、状态三个条件可能是互斥的。</p>"
          + '<div class="acts"><button class="btn" type="button" data-clear="all">清空全部条件</button></div></div>';
      syncURL();
      return;
    }
    $("#list-empty").innerHTML = "";

    var pages = Math.max(1, Math.ceil(results.length / PAGE_SIZE));
    if (S.page > pages - 1) S.page = pages - 1;
    if (S.page < 0) S.page = 0;
    var start = S.page * PAGE_SIZE;
    var slice = results.slice(start, start + PAGE_SIZE);
    var rowFn = S.view === "gallery" ? cardHTML : rowHTML;
    list.innerHTML = slice.map(function (p, k) { return rowFn(p, start + k); }).join("");

    var meta = "共 " + results.length + " 个整合包";
    if (pages > 1) meta += " · 第 " + (S.page + 1) + " / " + pages + " 页";
    $("#listmeta").innerHTML = esc(meta)
      + (results.length !== PACKS.length
        ? ' <button class="reset" type="button" data-clear="all">清空筛选</button>' : "");

    renderPager(results.length);
    syncURL();
  }

  function renderPager(total) {
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var pager = $("#pager");
    if (pages <= 1) { pager.innerHTML = ""; return; }
    var html = '<button type="button" data-page="prev"' + (S.page === 0 ? " disabled" : "") + ">上一页</button>";
    var from = Math.max(0, S.page - 2), to = Math.min(pages - 1, S.page + 2);
    if (from > 0) html += '<button type="button" data-page="0">1</button>' + (from > 1 ? '<span class="pg-gap">…</span>' : "");
    for (var i = from; i <= to; i++) {
      html += '<button type="button" data-page="' + i + '"' + (i === S.page ? ' class="cur" aria-current="page"' : "") + ">" + (i + 1) + "</button>";
    }
    if (to < pages - 1) html += (to < pages - 2 ? '<span class="pg-gap">…</span>' : "") + '<button type="button" data-page="' + (pages - 1) + '">' + pages + "</button>";
    html += '<button type="button" data-page="next"' + (S.page >= pages - 1 ? " disabled" : "") + ">下一页</button>";
    pager.innerHTML = html;
  }

  // ---------- 路由 ----------

  function parseHash() {
    var raw = location.hash.replace(/^#\/?/, "");
    var qs = "", path = raw;
    var qi = raw.indexOf("?");
    if (qi > -1) { path = raw.slice(0, qi); qs = raw.slice(qi + 1); }
    var out = { name: "search", slug: null, params: {} };
    if (path.indexOf("p/") === 0) { out.name = "detail"; try { out.slug = decodeURIComponent(path.slice(2)); } catch (e) { out.slug = path.slice(2); } }
    else if (path === "about") out.name = "about";
    qs.split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1));
      out.params[k] = v;
    });
    return out;
  }

  function readListState(params) {
    S.q = params.q || "";
    $("#q").value = S.q;
    S.st = params.st && CAT_LABEL[params.st] ? params.st : "all";
    S.ver = params.ver || "";
    S.loader = params.lo || "";
    S.sort = params.sort === "az" ? "az" : "dl";
    S.view = params.view === "list" ? "list" : "gallery";
    S.page = Math.max(0, (parseInt(params.page, 10) || 1) - 1);
    document.querySelectorAll("[data-view]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === S.view));
    });
    $("#f-ver").value = S.ver;
    $("#f-loader").value = S.loader;
    $("#f-sort").value = S.sort;
  }

  var lastRouted = null;

  function route() {
    // popstate 与 hashchange 都会来一趟，同一个 hash 只渲染一次
    if (location.hash === lastRouted) return;
    lastRouted = location.hash;

    var cameFrom = currentRoute.name;
    var r = parseHash();
    if (r.name === "detail") {
      setView("detail");
      renderDetail(BY_SLUG[r.slug]);
      window.scrollTo(0, 0);
    } else if (r.name === "about") {
      setView("about");
      renderAbout();
      window.scrollTo(0, 0);
    } else {
      var isBack = cameFrom === "detail";
      readListState(r.params);
      // 从详情返回：回到原来那一屏；其它情况（新开链接）留在顶部
      showIndex(isBack ? { scroll: true, scrollY: listScroll } : { scroll: false });
    }
  }

  function navigate(hash, state) {
    var st = state || {};
    st.own = true;
    if (location.hash === hash) { lastRouted = null; route(); return; }
    try { history.pushState(st, "", hash); } catch (e) { location.hash = hash.slice(1); return; }
    route();
  }

  window.addEventListener("popstate", function () { lastRouted = null; route(); });
  window.addEventListener("hashchange", function () { route(); });

  // ---------- 事件 ----------
  document.addEventListener("click", function (e) {
    // 所有站内 #/ 链接都走 pushState：浏览器后退键、链接分享、刷新都落在同一处
    var anchor = e.target.closest('a[href^="#/"]');
    if (anchor && !anchor.hasAttribute("data-back")) {
      e.preventDefault();
      listScroll = 0;
      navigate(anchor.getAttribute("href"), null);
      return;
    }

    var back = e.target.closest("[data-back]");
    if (back) {
      e.preventDefault();
      // 上一屏是本站在管的，就真的后退（和浏览器返回键行为一致）；直接打开详情时才退回索引
      if (history.state && history.state.own) history.back();
      else navigate("#/", null);
      return;
    }

    var f = e.target.closest("[data-filter]");
    if (f) {
      S.st = f.dataset.filter; S.page = 0;
      renderFilters(); renderList();
      return;
    }

    var vt = e.target.closest("[data-view]");
    if (vt && vt.dataset.view) {
      S.view = vt.dataset.view; S.page = 0;
      document.querySelectorAll("[data-view]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.view === S.view));
      });
      renderList();
      return;
    }

    var clear = e.target.closest("[data-clear]");
    if (clear) {
      var what = clear.dataset.clear;
      if (what === "q" || what === "all") { S.q = ""; $("#q").value = ""; }
      if (what === "all") { S.st = "all"; S.ver = ""; S.loader = ""; $("#f-ver").value = ""; $("#f-loader").value = ""; renderFilters(); }
      S.page = 0;
      renderList();
      $("#q").focus();
      return;
    }

    var pg = e.target.closest("[data-page]");
    if (pg && !pg.disabled) {
      var pages = Math.max(1, Math.ceil(lastResults.length / PAGE_SIZE));
      var v = pg.dataset.page;
      if (v === "prev") S.page = Math.max(0, S.page - 1);
      else if (v === "next") S.page = Math.min(pages - 1, S.page + 1);
      else S.page = Math.min(pages - 1, Math.max(0, Number(v) || 0));
      renderList();
      var top = $("#list").getBoundingClientRect().top + window.scrollY - 76;
      window.scrollTo(0, Math.max(0, top));
      listScroll = window.scrollY;
      return;
    }

    var row = e.target.closest(".rowhit, .cardhit");
    if (row) {
      var slug = row.dataset.slug;
      listScroll = window.scrollY;
      navigate("#/p/" + encodeURIComponent(slug), { fromList: true });
      return;
    }

    var copy = e.target.closest("[data-copy]");
    if (copy) {
      var url = location.origin + location.pathname + location.search + "#/p/" + encodeURIComponent(copy.dataset.copy);
      var done = function () {
        var old = copy.innerHTML;
        copy.innerHTML = ICON.link + " 已复制";
        setTimeout(function () { copy.innerHTML = old; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, done);
      } else { done(); }
      return;
    }

    var more = e.target.closest("[data-desc]");
    if (more) {
      var d = $("#desc");
      if (d) {
        var open = d.classList.toggle("open");
        more.textContent = open ? "收起简介" : "展开简介";
      }
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && currentRoute.name !== "search") {
      var back = document.querySelector("#view-" + currentRoute.name + " [data-back]");
      if (back) { back.click(); return; }
    }
    var tag = (e.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
    if (e.key === "/" && !typing && currentRoute.name === "search") {
      e.preventDefault();
      $("#q").focus();
      $("#q").select();
    }
  });

  var t = null;
  $("#q").addEventListener("input", function () {
    clearTimeout(t);
    S.q = $("#q").value.trim();
    S.page = 0;
    t = setTimeout(renderList, 120);
  });
  $("#search-form").addEventListener("submit", function (e) {
    e.preventDefault();
    S.q = $("#q").value.trim();
    S.page = 0;
    renderList();
  });
  $("#f-ver").addEventListener("change", function () { S.ver = this.value; S.page = 0; renderList(); });
  $("#f-loader").addEventListener("change", function () { S.loader = this.value; S.page = 0; renderList(); });
  $("#f-sort").addEventListener("change", function () { S.sort = this.value; S.page = 0; renderList(); });

  // 记住列表滚动位置（返回时用它复原）
  window.addEventListener("scroll", function () {
    if (currentRoute.name === "search") listScroll = window.scrollY;
  }, { passive: true });

  // ---------- 初始渲染 ----------
  paintTheme();
  renderStats();
  renderFilters();
  renderSelects();
  route();
})();
</script>
</body>
</html>
