name: farm-merge

# 每台主机（serv00 / instabox，名字由 origin/farm/* 自动发现）各自把产物推到自己分支 farm/<host>，
# 永不 push main。本工作流负责把这些分支的增量合进 main：取 delta → 补布局（build-index）
# → 过闸门 → 打包 → 镜像 → 补交付状态并重算站点数据 → 显式提交 → 触发部署。
#
# 为什么 build-index 要跑两次：layout 来自 research/scan-full.tsv 的 format 列，产物是
# research/index-dataset.json；而 release.mjs 与 validate-quests.mjs 都从它取 layout。
# 新合进来的包如果还不在这份索引里，就会被当成「分离布局」——内嵌包要么假绿要么误红。
#
# 为什么不在主机上直接 push main：主机上只有只读 deploy key（1 把），
# 也没法跑 npm 全套校验；而且三台同时 push main 必然互相顶掉。
#
# 为什么**不用** `push: branches: ['farm/**']` 触发（2026-10-23 实测踩到）：
# push 事件用的是「被推那条分支里」的 workflow 文件。farm 分支是从某一刻的 main 切出来的，
# 之后 main 上的 workflow 修复永远不会自动流进去 —— 结果就是「改好了 main、push 上去
# 却仍然按旧版报错」。schedule 与 workflow_dispatch 永远读默认分支的 workflow，不受这个影响。
# 代价是合并最多滞后一个调度周期（15 分钟），而主机本身也是每 20 包 / 20 分钟才推一次，
# 这个滞后相对整批耗时可忽略。
on:
  # 定时合并已于 2026-10-23 19:45 停用，改由本机 `npm run publish` 一次性合并发布。
  # 要开回来就把下面三行取消注释（`schedule:` 不能只留注释：GitHub 会把空的 schedule
  # 当非法工作流，push 时刷一堆 0 秒失败的 run，日志里什么都没有，只会污染历史）。
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      hosts:
        description: '逗号分隔的主机名（留空 = 所有 farm/* 分支）'
        required: false
        default: ''
        type: string
      maxPacks:
        description: '单轮最多合并多少个包（默认 80；超出按 slug 字典序截断，其余留待下一轮）'
        required: false
        default: '80'
        type: string
      dryRun:
        description: '只计算增量并输出摘要，不落盘、不镜像、不提交'
        required: false
        default: false
        type: boolean
      mirrorOnly:
        description: '只补夸克镜像：给「已有 zip 但分享链接为空」的历史包回填链接，不合并、不打包'
        required: false
        default: false
        type: boolean
      mirrorLimit:
        description: 'mirrorOnly 时最多处理多少个包（默认 50，防止一次几千次上传触发风控）'
        required: false
        default: '50'
        type: string
      quarkRename:
        description: '只做夸克网盘重命名（把已上传的文件改成带版本号的本地名），不合并、不镜像'
        required: false
        default: false
        type: boolean
      quarkRenameLimit:
        description: 'quarkRename 时最多改多少条（0 = 全部；第一次请填 1 做试点）'
        required: false
        default: '0'
        type: string
      quarkVerifyOnly:
        description: '只复查改名后分享链接是否还能打开（不改名），含重试与间隔'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则 dispatch 端点 403）
  actions: write

# 与 deploy.yml / translate.yml 共用 concurrency 组：三者都会写仓库。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  merge:
    # quarkRename 是独立任务（只动网盘文件名，不碰仓库），由下面的 quark-rename job 承担。
    # 这里一个 job 级条件挡掉，比给 11 个 step 各加一条 `inputs.quarkRename != true` 可靠。
    if: inputs.quarkRename != true && inputs.quarkVerifyOnly != true
    runs-on: ubuntu-latest
    # 主要成本是拉 blob + 夸克上传；给足余量，避免慢网被误杀。
    # 8 台主机、单轮最多 80 个包（含逐个上传）后 120 分钟不够用，350 覆盖「80 包 + 20 个回填」的最坏组合。
    timeout-minutes: 350
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # 只有 main 的 depth=1：farm 分支下面单独按需拉，不能跟着一起下。
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare workspace
        run: |
          echo "FARM_DIR=$RUNNER_TEMP/farm" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/farm"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 为什么是 --filter=blob:none + --depth=1：
      # 每条 farm/<host> 分支的 tip 树都带数百 MB（patches/ 全量 + research/packs/*.tar.gz），
      # 老实的 depth=1 同样会把树里所有 blob 全下下来，8 台加起来单次就要拉好几 GB。
      # blobless 只取 commit + tree（几 MB），随后 git checkout <ref> -- <path> 时才按路径
      # 按需拉那几个 blob；本轮真正要的通常只有几十个 .snbt 和一两个 tar.gz。
      - name: Fetch farm branches (blobless)
        run: |
          set -euo pipefail
          if git -c gc.auto=0 fetch --no-tags --prune --filter=blob:none --depth=1 \
               origin '+refs/heads/farm/*:refs/remotes/origin/farm/*'; then
            exit 0
          fi
          # 通配 refspec 一条都匹配不上时 git fetch 返回 1（不是警告），
          # 而「分支还没建」是正常的初始状态，不能因此把定时任务刷成红。
          # 用 ls-remote 区分：确实没有分支 → 放行；有分支却 fetch 失败 → 真故障，照常报错。
          if [ "$(git ls-remote --heads origin 'refs/heads/farm/*' | wc -l)" -eq 0 ]; then
            echo "::warning::远端还没有 farm/* 分支，本轮无事可做"
            # 分支被删光时本地会留下旧的 remote-tracking ref，不清理的话下一轮会拿幽灵 tip 去 diff。
            git for-each-ref --format='%(refname)' refs/remotes/origin/farm | xargs -r -n1 git update-ref -d
            exit 0
          fi
          echo "::error::farm 分支存在但 fetch 失败（网络 / 凭据 / 部分克隆不支持）"
          exit 1

      - name: Resolve hosts
        id: hosts
        run: |
          set -euo pipefail
          RAW="${{ inputs.hosts }}"
          if [ -n "$RAW" ]; then
            # 手动触发可以只合一台，便于排障时不惊动其他主机。
            LIST=$(printf '%s' "$RAW" | tr ',' ' ')
          else
            LIST=$(git for-each-ref --format='%(refname:lstrip=4)' refs/remotes/origin/farm | sort | tr '\n' ' ')
          fi
          LIST=$(printf '%s' "$LIST" | tr -s ' ' | sed 's/^ //; s/ $//')
          # host 会被直接拼进 `git checkout origin/farm/<h>`、diff 文件名和目录名，
          # 不校验就等于把 `../`、空格、大写之类的输入交给 git。
          # 规则与 scripts/lib/farm-merge.mjs 的 isValidHost 保持一致。
          BAD=""
          for h in $LIST; do
            if [[ ! "$h" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              BAD="$BAD $h"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::hosts 含非法值:$BAD（只允许小写字母/数字开头，后接小写字母、数字或连字符）"
            exit 1
          fi
          # 变量名必须与后面 `for h in $HOSTS` 一致（大写）。GitHub Actions 的环境变量
          # 名区分大小写，写成小写会让下一步在 `set -u` 下直接 "HOSTS: unbound variable"。
          echo "HOSTS=$LIST" >> "$GITHUB_ENV"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          [ -n "$LIST" ] || echo "::warning::远端没有 farm/* 分支，本轮无事可做"

      - name: Compute merge plan
        id: plan
        # 不跳过：没有 farm 分支时也要跑一次，让 outputs.count 明确等于 0，
        # 后续步骤的 `count != '0'` 判断才不会被空字符串放行（会在读 plan.json 时炸）。
        run: |
          set -euo pipefail
          # 必须 two-dot（origin/main origin/farm/<h>），不能用 three-dot：
          # 主机从不追 main，Action 里又只有 --depth=1 的浅历史，两边没有 merge-base，
          # `origin/main...origin/farm/<h>` 会直接 fatal（"no merge base"）。
          # 代价是 two-dot 给出的是两棵树的**全量**差异：别台刚合进 main 的包在这里会显示成 D
          # （看起来是本分支把它删了）。所以必须配 --diff-filter=AM 只认新增/修改，
          # 否则每轮都会把同事刚合进来的产物当成待删项，越合越少。
          # core.quotePath=false：别让 git 把非 ASCII 路径转成 \xxx 转义，否则解析不出 slug。
          for h in $HOSTS; do
            # --no-renames：整树 pathspec 下默认的 rename 检测会把「新增整章文件」
            # 和别处同名的删除配成 R，再被 --diff-filter=AM 滤掉 → 还原清单缺文件 →
            # 闸门误报「缺 N 个键」。2026-10-24 实测 30 个包共缺 166 个文件，全是 R。
            git -c core.quotePath=false diff --name-only --no-renames --diff-filter=AM \
              origin/main "origin/farm/$h" -- patches research/packs > "$FARM_DIR/diff-$h.txt"
          done
          node scripts/lib/farm-merge.mjs --dir "$FARM_DIR" \
            --hosts "$(printf '%s' "$HOSTS" | tr ' ' ',')" \
            --out "$FARM_DIR/plan.json" --github-output "$GITHUB_OUTPUT"

      # 单轮上限：8 台主机同时产出时 delta 可能是几百个包，一轮全吃会把 job 拖过超时、
      # 夸克上传也更容易撞风控。截断而不是「随机取一部分」：
      # 按 slug 字典序取前 N 个 —— 顺序稳定、可重放，同一个 plan 每次都截出同一批；
      # 而且被截掉的包下一轮仍在 diff 里（main 还没合它们），所以不会饿死，只是排后面。
      # 为什么不按主机轮流取：那需要跨轮记住游标，计划就不再是纯函数，重跑结果会漂。
      - name: Cap packs per run
        id: cap
        run: |
          set -euo pipefail
          if [ ! -f "$FARM_DIR/plan.json" ]; then
            echo "::error::plan.json 不存在（Compute merge plan 未成功），无法确定本轮合并集合"
            exit 1
          fi
          CAP="${{ inputs.maxPacks }}"
          # 非数字或 0 一律退回 80：0 等于「本轮什么都不合」，与 dryRun 语义重叠，
          # 真按 0 截断只会让后面的步骤对着空计划空转，属于误配而不是意图。
          case "$CAP" in ''|*[!0-9]*) CAP=80 ;; esac
          # 10# 前缀强制十进制：直接 `[ 080 -ge 1 ]` 会被当成八进制而报 "value too great for base"。
          CAP=$((10#$CAP))
          [ "$CAP" -ge 1 ] || CAP=80
          CAP="$CAP" node --input-type=module -e '
            import { appendFileSync, readFileSync, writeFileSync } from "node:fs"
            const dir = process.env.FARM_DIR
            const plan = JSON.parse(readFileSync(`${dir}/plan.json`, "utf8"))
            const cap = Number(process.env.CAP)
            const all = Object.keys(plan.bySlug)
            // 只有真的超了才重排：没超时保持 bySlug 的原插入序，避免无谓地改写文件。
            const kept = all.length > cap ? [...all].sort().slice(0, cap) : all
            if (all.length > cap) {
              const keep = new Set(kept)
              const bySlug = {}
              for (const slug of kept) bySlug[slug] = plan.bySlug[slug]
              // conflicts 只留本轮真合并的 slug：被截断的包并没有进 main，
              // 摘要里再写「取了哪台」会让人以为它已经落地了。
              const conflicts = plan.conflicts.filter((c) => keep.has(c.slug))
              // skipped 原样保留：它们是「候选不合格」的包，本来就不在 bySlug 里，
              // 与截断无关；剔掉反而丢掉「这些包为什么一直合不进来」的线索。
              const skipped = plan.skipped
              const byHost = {}
              for (const item of Object.values(bySlug)) byHost[item.branch] = (byHost[item.branch] ?? 0) + 1
              const stats = {
                count: kept.length,
                byHost,
                conflicts: conflicts.length,
                skipped: skipped.length,
              }
              writeFileSync(`${dir}/plan.json`, `${JSON.stringify({ bySlug, conflicts, skipped, stats })}\n`)
              // 摘要那一步在本进程之后才写，把这句话落到文件里交给它统一输出，
              // 免得 Step Summary 出现「先一句截断、再一个标题」的错位。
              writeFileSync(
                `${dir}/trunc-note.txt`,
                `- 本轮截断：**${all.length} → ${kept.length}**，剩余 ${all.length - kept.length} 个留待下一轮（按 slug 字典序）\n`,
              )
              console.log(`[cap] ${all.length} → ${kept.length}（上限 maxPacks=${cap}）`)
            }
            // 本步骤的 $GITHUB_OUTPUT 是独立文件（不能回写 steps.plan 的），
            // 所以下游要拿「截断后」的集合就必须读这里的 count/slugs。
            appendFileSync(process.env.GITHUB_OUTPUT, `count=${kept.length}\nslugs=${kept.join(",")}\n`)
          '

      - name: Check out only the delta
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true) && inputs.mirrorOnly != true
        run: |
          set -euo pipefail
          # 逐文件 checkout，不整目录覆盖：main 的 patches/<slug>/ 里可能已经有别台合进来的
          # 文件，整目录 checkout 会按本分支的旧树把它们回滚掉。
          # 这里同时把 research/packs/<slug>.tar.gz 基准源落到工作区；顺序很关键：
          # validate-quests 会双读目录与 tar.gz 拿英文键集，基准源没下来就会按「缺基准键集」判红。
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { execFileSync } from "node:child_process"
            const { bySlug } = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
            for (const [slug, item] of Object.entries(bySlug)) {
              const paths = [...item.patchPaths, item.baselinePath].filter(Boolean)
              execFileSync("git", ["checkout", `origin/farm/${item.branch}`, "--", ...paths], { stdio: "inherit" })
              console.log(`[${slug}] ← farm/${item.branch}（${paths.length} 个文件）`)
            }
          '

      # 第一轮 build-index（只补布局）：layout 来自 research/scan-full.tsv 的 format 列
      # （见 scripts/build-index.mjs:311-312），产物是 research/index-dataset.json。
      # 而 release.mjs（打包）与 validate-quests.mjs（闸门）都从 index-dataset 取 layout：
      # 本轮新合进来的包在里面还没有记录 → layout 未知 → 内嵌包被按分离布局打包/校验，
      # 结果不是假绿就是误红。所以必须在闸门和打包之前先补一趟布局。
      # 此刻 downloads/<slug>.zip 还没生成（delivered=false），下一轮再补交付状态。
      - name: Build index (layout pass)
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true)
        run: node scripts/build-index.mjs

      # 闸门：增量落盘之后、打包之前。npm test 里已经含 build/site 的数据契约测试。
      - name: Run tests
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true)
        run: npm test

      - name: Validate quest files
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true)
        run: |
          set -uo pipefail
          # 闸门判红时先「踢掉坏包再校验一次」，而不是整批停摆。
          # 为什么：坏包绝大多数是主机在上一次运行被中断时写出的残包（缺几百到上万个键），
          # 属于个例；为了它把 1,600 个包的合并全部堵住，代价远大于收益 —— 2026-10-23 实测
          # 连续三次合并都因为 2~4 个残包整批变红。踢掉后它们在工作区消失，本轮不打包、
          # 不镜像、不入库；主机侧因为分支上那份也已被删，下一轮会重新翻译。
          # 注意：这里必须真的把文件从工作区删掉，只加变量不动文件的话，后面的
          # release --package-only 依然会把坏包打成 zip。
          set +e
          OUT=$(node scripts/validate-quests.mjs 2>&1)
          RC=$?
          set -e
          echo "$OUT" | tail -60
          if [ "$RC" -ne 0 ]; then
            BAD=$(printf '%s\n' "$OUT" | grep -oE '✘ patches/[A-Za-z0-9._-]+' | sed 's#.*patches/##' | sort -u | tr '\n' ' ')
            if [ -z "$BAD" ]; then
              echo "::error::闸门变红但解析不出失败包名，按硬失败处理（不要静默放行）"
              exit 1
            fi
            echo "::warning::闸门拦下：$BAD —— 这些包本轮排除，其余继续合并"
            for s in $BAD; do
              git rm -q -r --cached "patches/$s" 2>/dev/null || true
              rm -rf "patches/$s" "research/packs/$s.tar.gz"
            done
            echo "BLOCKED_SLUGS=$BAD" >> "$GITHUB_ENV"
            # 二次校验：剩下的必须全绿；仍红说明不是「个别残包」，这时才该真红。
            node scripts/validate-quests.mjs
          fi

      # 先打包：镜像上传的是 downloads/<slug>.zip，它由 release.mjs 产出（幂等，重跑字节相同）。
      # 必须在 layout pass 之后：release.mjs 用 index-dataset 里的 layout 决定 zip 的目录形态。
      - name: Package patches
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true) && inputs.mirrorOnly != true
        run: |
          set -euo pipefail
          # 闸门那步会把坏包从工作区删掉，这里必须按「目录还在」过滤一遍：
          # release.mjs 对空目录会打出只有一个 README 的空 zip，等于把坏包伪装成已发布。
          # slug 取 cap 步骤的（= 截断后的集合），不能读 steps.plan：那是未截断的全量 delta。
          KEEP=""
          for s in $(printf '%s' "${{ steps.cap.outputs.slugs }}" | tr ',' ' '); do
            if [ -d "patches/$s" ]; then KEEP="$KEEP,$s"; fi
          done
          KEEP=${KEEP#,}
          if [ -z "$KEEP" ]; then
            echo "::warning::本轮没有任何可打包的包（全部被闸门排除）"
            echo "PACKAGE_SLUGS=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PACKAGE_SLUGS=$KEEP" >> "$GITHUB_ENV"
          node scripts/release.mjs --ids "$KEEP" --package-only

      # 夸克登录态：CI 里没有浏览器，只能把本机已验证的存根写到 CLI 真正读取的位置。
      # 路径必须是 <技能根>/qoder/config.json；旧写法的 openclaw/config.json 不生效（实测），
      # 会让 CLI 表现为未登录：绿色通过但零链接。写入后只报字节数，绝不打印内容。
      #
      # 注意末尾 `|| (github.event_name == 'schedule' && steps.plan.outputs.count == '0')`：
      # 定时轮次没有 delta 时也要走「自愈回填」（见 Resolve mirror targets 的第 3 个来源），
      # 而回填同样需要登录态与 CLI。不加这个分支，自愈就是死代码 —— 步骤根本不会被执行。
      # 这一句只放宽「什么时候跑」，dryRun / mirrorOnly 的语义一个字没动。
      # 这里用粗条件（不判断是否真有缺口）是有意的：本步只是写一个小文件、下一步下 620KB，
      # 都是幂等小动作；为了省它再插一个探测步骤，反而多一处要维护的判断。
      - name: Restore quark config
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.plan.outputs.count == '0'))
        env:
          QUARK_CONFIG_JSON: ${{ secrets.QUARK_CONFIG_JSON }}
        run: |
          if [ -z "$QUARK_CONFIG_JSON" ]; then
            echo "未提供 QUARK_CONFIG_JSON，跳过"
            exit 0
          fi
          SKILL_DIR="$HOME/.pi/agent/skills/quarkclouddrive"
          mkdir -p "$SKILL_DIR/qoder"
          printf '%s' "$QUARK_CONFIG_JSON" > "$SKILL_DIR/qoder/config.json"
          chmod 600 "$SKILL_DIR/qoder/config.json"
          echo "登录态已写入（$(wc -c < "$SKILL_DIR/qoder/config.json" | tr -d ' ') 字节，内容不打印）"

      # CLI 是 620KB 自包含单文件，超 secret 48KB 上限，也不入库，只能每次下载。
      # 安装脚本本身容错（失败只警告、exit 0）；本轮「必须」镜像由 QUARK_REQUIRED=1 保证。
      - name: Install quark CLI
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.plan.outputs.count == '0'))
        run: bash scripts/install-quark-cli.sh

      - name: Resolve mirror targets
        id: mirrorTargets
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.plan.outputs.count == '0'))
        run: |
          set -euo pipefail
          # 三个来源：
          #  1) 本轮合进来的包（PACKAGE_SLUGS）；
          #  2) mirrorOnly 回填模式：有 zip 但 research/quark-mirrors.json 里 shareUrl 为空的历史包；
          #  3) schedule 自愈：定时轮次没有 delta 时，自动补最多 20 个同样状态的历史包。
          # 为什么要有 (2)(3)：镜像失败只留空不阻断（mirror.mjs 的设计如此），于是「uploaded 但
          # 没拿到分享链接」会安静地停在空字符串上 —— 站点上按钮不渲染、页面也不报错，没人会发现。
          # 2026-10-23 就有 11 个包是这个状态。手动回填 (2) 靠人想起来，(3) 让定时任务自己慢慢补完。
          LIST=""
          if [ -n "${PACKAGE_SLUGS:-}" ]; then
            LIST="$PACKAGE_SLUGS"
          fi
          if [ "${{ inputs.mirrorOnly }}" = "true" ]; then
            LIMIT="${{ inputs.mirrorLimit }}"
            case "$LIMIT" in ''|*[!0-9]*) LIMIT=50 ;; esac
            BACKFILL=$(node --input-type=module -e '
              import { readFileSync, readdirSync } from "node:fs"
              const mirrors = JSON.parse(readFileSync("research/quark-mirrors.json", "utf8")).mirrors || {}
              const zips = readdirSync("downloads").filter((f) => f.endsWith(".zip")).map((f) => f.slice(0, -4))
              const missing = zips.filter((s) => !(mirrors[s] && mirrors[s].shareUrl)).sort()
              console.log(missing.join(","))
            ')
            LIST="${LIST:+$LIST,}$BACKFILL"
          fi
          # (3) 只认 schedule 且本轮 delta 为空：有 delta 的轮次已经在跑打包/上传，
          # 再叠 20 个回填会把单轮耗时推高；空转的轮次才是补历史欠账的窗口。
          # 数量固定 20，**不读 mirrorLimit** —— 那个额度是手动回填的一次性配额，
          # 混用会让每晚的定时任务一次吃掉整轮配额，人工回填时反而没得跑。
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.plan.outputs.count }}" = "0" ]; then
            HEAL=$(node --input-type=module -e '
              import { readFileSync, readdirSync } from "node:fs"
              const mirrors = JSON.parse(readFileSync("research/quark-mirrors.json", "utf8")).mirrors || {}
              const zips = readdirSync("downloads").filter((f) => f.endsWith(".zip")).map((f) => f.slice(0, -4))
              const missing = zips.filter((s) => !(mirrors[s] && mirrors[s].shareUrl)).sort()
              console.log(missing.slice(0, 20).join(","))
            ')
            LIST="${LIST:+$LIST,}$HEAL"
          fi
          # 去重且保序
          LIST=$(printf '%s' "$LIST" | tr ',' '\n' | awk 'NF' | awk '!seen[$0]++' | paste -sd, -)
          if [ "${{ inputs.mirrorOnly }}" = "true" ] && [ -n "$LIST" ]; then
            LIMIT="${{ inputs.mirrorLimit }}"
            case "$LIMIT" in ''|*[!0-9]*) LIMIT=50 ;; esac
            LIST=$(printf '%s' "$LIST" | tr ',' '\n' | head -n "$LIMIT" | paste -sd, -)
          fi
          echo "MIRROR_SLUGS=$LIST" >> "$GITHUB_ENV"
          # 计数同时落在 output 上：后面的步骤要靠它判断「本轮到底有没有活要干」。
          # `|| true` 是因为 grep -c 无匹配时退出码为 1，在 set -e 下会直接掐掉这一步。
          N=$(printf '%s' "$LIST" | tr ',' '\n' | grep -c . || true)
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "镜像目标：$N 个"

      - name: Mirror to Quark
        id: mirror
        # 镜像失败不阻断入库：译文是主要价值，先把 main 推进去；
        # 但「零链接却绿灯」不可接受，由末尾独立一步统一判红。
        # 第三个分支是自愈回填：只有 Resolve 真的枚举出待补链接时才跑（count 来自那一步），
        # 否则每个 15 分钟的定时轮次都会白跑一次 mirror.mjs 并刷一条「没有需要镜像的包」警告。
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.mirrorTargets.outputs.count != '0'))
        continue-on-error: true
        run: |
          CLI="$HOME/.pi/agent/skills/quarkclouddrive/scripts/quark-drive.cjs"
          if [ -f "$CLI" ]; then
            export QUARK_CLI="$CLI"
            echo "夸克 CLI：$CLI（$(wc -c < "$CLI" | tr -d ' ') 字节）"
          else
            echo "::warning::夸克 CLI 不存在（Install quark CLI 未成功），本轮跳过镜像。"
          fi
          # 空值必须显式跳过：mirror.mjs 的 --ids 传空串等于「不限定」，会把全部历史 zip
          # 重新走一遍上传流程（幂等能挡住重复分享，但没必要每周烧几百次调用）。
          if [ -z "${MIRROR_SLUGS:-}" ]; then
            echo "::warning::本轮没有需要镜像的包，跳过"
            exit 0
          fi
          node scripts/mirror.mjs --ids "$MIRROR_SLUGS"
        env:
          QODER_PRODUCT_ID: qoder
          QODER_AGENT: 'true'
          QUARK_DIR_NAME: 整合包汉化
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
          # 本轮「必须」完成夸克镜像：有目标待镜像而 CLI 缺失时 mirror.mjs 置退出码 1。
          QUARK_REQUIRED: '1'

      # 汇总各补丁目录下的 `.source.json`（补丁基于哪个上游文件翻译的）。
      # 单写入者：只在 CI 跑，worker 只推自己那个补丁目录，故不会出现并发合并冲突。
      # 必须在 build-site-data 之前完成 —— 站点数据要读这份汇总。
      - name: Collect source versions
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.mirrorTargets.outputs.count != '0'))
        run: node scripts/source-versions.mjs

      # 第二轮 build-index（只补交付状态）：此时 downloads/<slug>.zip 已存在 → delivered=true。
      # 两次 build-index 是「先补布局、后补交付状态」，代价只多生成一次 13MB 的 JSON，
      # 换来打包与闸门拿到正确 layout——比在 release/validate 里各自猜布局便宜得多。
      # 索引与站点数据仍须在本轮 zip / 镜像链接落盘之后重算，否则新条目在站点上是「未交付」。
      # 自愈回填那一轮没有新包，但 quark-mirrors.json 变了，站点上按钮要不要渲染取决于这份数据，
      # 所以这条链必须跟着重算并提交，否则链接补好了也没人看得见。
      - name: Rebuild index (delivered pass) and site data
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.mirrorTargets.outputs.count != '0'))
        run: |
          node scripts/build-index.mjs
          node scripts/build-site-data.mjs
          node scripts/build-site-html.mjs

      - name: Stage artifacts
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.mirrorTargets.outputs.count != '0'))
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { bySlug } = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
            for (const slug of Object.keys(bySlug)) console.log(slug)
          ' > "$FARM_DIR/slugs.txt"

          # 显式路径 git add（禁止 -A）：main 上还有别的代理在改脚本，-A 会把他们的半成品带进来。
          # 补丁包有两种文件名：旧名 downloads/<slug>.zip、新名 downloads/<slug>_v<version>.zip。
          # 用 glob 一次覆盖；`[ -e "$f" ]` 保证两种形态缺一种时不会因未匹配而报错。
          while IFS= read -r slug; do
            for p in "patches/$slug" "research/packs/$slug.tar.gz"; do
              if [ -e "$p" ]; then git add -- "$p"; fi
            done
            for f in "downloads/$slug.zip" downloads/"$slug"_v*.zip; do
              if [ -e "$f" ]; then git add -- "$f"; fi
            done
          done < "$FARM_DIR/slugs.txt"
          for p in research/index-dataset.json site/data.json research/quark-mirrors.json research/source-versions.json glossary.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

      - name: Commit and push
        id: commit
        if: inputs.dryRun != true && (steps.plan.outputs.count != '0' || inputs.mirrorOnly == true || (github.event_name == 'schedule' && steps.mirrorTargets.outputs.count != '0'))
        env:
          MIRROR_ONLY: ${{ inputs.mirrorOnly }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          # 提交说明按主机分布生成，事后翻 git log 能直接看出这一轮是谁贡献的。
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { bySlug } = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
            const mirrorOnly = process.env.MIRROR_ONLY === "true"
            // mirrorOnly 跑的是「补镜像」，**不合并任何产物**（checkout 那步被跳过）。
            // 但 plan 里依然有全部待合并包，若照样按 plan 计数写 commit message，
            // 就会出现「farm: 合并 80 个整合包」而 patches/downloads 零变更的假记录 ——
            // 2026-10-23 连续四轮都这样，让人误判合并正常、实际 backlog 一直没动。
            if (mirrorOnly) {
              const n = (process.env.MIRROR_SLUGS || "").split(",").filter(Boolean).length
              console.log(`farm: 夸克镜像回填 ${n} 个补丁包（未合并产物）`)
            } else {
              const byHost = {}
              for (const item of Object.values(bySlug)) byHost[item.branch] = (byHost[item.branch] ?? 0) + 1
              const parts = Object.entries(byHost).sort().map(([h, n]) => `${h}×${n}`).join(", ")
              console.log(`farm: 合并 ${Object.keys(bySlug).length} 个整合包（${parts}）`)
            }
          ' > "$FARM_DIR/commit-msg.txt"
          git commit -m "$(cat "$FARM_DIR/commit-msg.txt")"
          # 合并期间别的代理/工作流可能也推了 main：rebase 上来再推，别用 force。
          git pull --rebase --autostash origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的 push 不会触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## farm 合并结果"
            if [ ! -f "$FARM_DIR/plan.json" ]; then
              echo ""
              echo "没有 farm/* 分支或未计算增量，本轮无事可做。"
            else
              node --input-type=module -e '
                import { readFileSync } from "node:fs"
                const plan = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
                const { stats, bySlug, conflicts, skipped } = plan
                console.log(`- 新增/更新：**${stats.count}** 个整合包${stats.count ? `（${Object.keys(bySlug).join("、")}）` : ""}`)
                const dist = Object.entries(stats.byHost).sort().map(([h, n]) => `${h} × ${n}`).join("，")
                console.log(`- 按主机分布：${dist || "无"}`)
                console.log(`- 冲突（取新者，不判失败）：${conflicts.length ? conflicts.map((c) => `\`${c.slug}\`（${c.winning} 胜 ${c.losers.join("/")}）`).join("、") : "无"}`)
                console.log(`- 跳过：${skipped.length ? skipped.map((s) => `\`${s.slug}\` — ${s.reason}`).join("；<br>") : "无"}`)
              '
            fi
            # 截断说明由 Cap packs per run 落成文件：没有截断就没有这个文件，摘要是干净的。
            if [ -s "$FARM_DIR/trunc-note.txt" ]; then
              cat "$FARM_DIR/trunc-note.txt"
            fi
            # 覆盖率放在最后统一算：它看的是整个仓库的存量（downloads 与 mirrors），
            # 与本轮合并了什么都无关 —— 所以即使本轮无事可做，也要让人一眼看出还差多少个。
            node --input-type=module -e '
              import { existsSync, readFileSync, readdirSync } from "node:fs"
              const zips = existsSync("downloads")
                ? readdirSync("downloads").filter((f) => f.endsWith(".zip")).length
                : 0
              let links = 0
              try {
                const mirrors = JSON.parse(readFileSync("research/quark-mirrors.json", "utf8")).mirrors || {}
                links = Object.values(mirrors).filter((m) => m && m.shareUrl).length
              } catch {}
              // 差额可能为负：mirrors.json 是只增不减的，包被删掉后旧链接还在里面。
              // 负数是「有链接没包」的信号，不抹平 —— 抹成 0 就等于把异常藏起来。
              console.log(`- 镜像覆盖：zip ${zips} / 有链接 ${links} / 缺口 ${zips - links}`)
            '
            echo ""
            if [ "${{ inputs.dryRun }}" = "true" ]; then
              echo "> dryRun：未落盘、未镜像、未提交。"
            fi
            echo "> 镜像步骤结果：${{ steps.mirror.outcome || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 判红标准从「mirror 步骤失败」收紧为「本轮确有目标且一个都没拿到链接」。
      # 为什么：没有目标时 mirror.mjs 会因 CLI 缺失 / 登录态过期而失败，但那不是本轮的账 ——
      # 按旧条件，每个 15 分钟的定时轮次都会因此变红，真正的故障反而淹没在噪音里。
      # MIRROR_SLUGS 由 Resolve mirror targets 写进 $GITHUB_ENV，跨步骤仍然可读，
      # 所以这里不需要再猜一次「本轮想镜像什么」。
      - name: Fail if quark mirror totally failed
        if: steps.mirror.outcome == 'failure'
        run: |
          set -uo pipefail
          if [ -z "${MIRROR_SLUGS:-}" ]; then
            echo "本轮无镜像目标，跳过判红"
            exit 0
          fi
          # 部分成功不算全挂：mirror.mjs 失败只留空不阻断，链接有没有真拿到要看落盘结果，
          # 不能只信退出码 —— 退出码 1 也可能是「80 个里挂了 3 个」。
          OK=$(MIRROR_SLUGS="$MIRROR_SLUGS" node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const want = process.env.MIRROR_SLUGS.split(",").map((s) => s.trim()).filter(Boolean)
            let mirrors = {}
            try {
              mirrors = JSON.parse(readFileSync("research/quark-mirrors.json", "utf8")).mirrors || {}
            } catch {}
            const ok = want.filter((s) => mirrors[s] && mirrors[s].shareUrl).length
            console.log(`${ok}/${want.length}`)
          ')
          case "$OK" in
            0/*)
              echo "::error::夸克镜像全军覆没（$OK 拿到链接）：多为登录态过期，或 CLI 下载/安装失败。产物已入库；网盘字段为空，修好后用 mirrorOnly 补跑。"
              exit 1
              ;;
          esac
          echo "::warning::夸克镜像部分失败（$OK 拿到链接），不判红：链接为空不阻断是本项目的既有设计，下一轮定时自愈会继续补。"

  # 夸克网盘里的存量文件改成带版本号的名字。
  #
  # 为什么要单独一个 job：它只动网盘文件名，不写仓库。塞进 merge job 就得给十几个
  # 合并/镜像步骤各加一条 `quarkRename != true` 的排除条件，改错一处就会在试点时
  # 顺带合并+打包+提交。job 级隔离只有一行。
  #
  # 为什么先试点 1 条：分享链接是绑 FID 生成的，改名理论上不影响，但官方没有明文保证，
  # `rename` 虽有 30 天 `rename-revert` 可回滚，先拿一条验证 `share-detail` 仍可访问更稳。
  quark-rename:
    if: github.event_name == 'workflow_dispatch' && (inputs.quarkRename == true || inputs.quarkVerifyOnly == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm ci || npm install
        run: npm ci || npm install

      - name: Restore quark config
        env:
          QUARK_CONFIG_JSON: ${{ secrets.QUARK_CONFIG_JSON }}
        run: |
          if [ -z "$QUARK_CONFIG_JSON" ]; then
            echo "::error::未提供 QUARK_CONFIG_JSON，无法登录夸克"
            exit 1
          fi
          SKILL_DIR="$HOME/.pi/agent/skills/quarkclouddrive"
          mkdir -p "$SKILL_DIR/qoder"
          printf '%s' "$QUARK_CONFIG_JSON" > "$SKILL_DIR/qoder/config.json"
          chmod 600 "$SKILL_DIR/qoder/config.json"
          echo "登录态已写入（$(wc -c < "$SKILL_DIR/qoder/config.json" | tr -d ' ') 字节，内容不打印）"

      - name: Install quark CLI
        run: bash scripts/install-quark-cli.sh

      - name: Rename quark files
        if: inputs.quarkRename == true
        env:
          QODER_PRODUCT_ID: qoder
          QODER_AGENT: 'true'
          QUARK_DIR_NAME: 整合包汉化
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
        run: |
          set -euo pipefail
          CLI="$HOME/.pi/agent/skills/quarkclouddrive/scripts/quark-drive.cjs"
          if [ ! -f "$CLI" ]; then
            echo "::error::夸克 CLI 不存在（Install quark CLI 未成功）"
            exit 1
          fi
          export QUARK_CLI="$CLI"
          LIMIT='${{ inputs.quarkRenameLimit }}'
          case "$LIMIT" in ''|*[!0-9]*) LIMIT=0 ;; esac
          echo "重命名上限：$LIMIT（0 = 全部）"
          node scripts/quark-rename.mjs --limit "$LIMIT" --verify
      - name: Verify quark shares
        if: inputs.quarkVerifyOnly == true
        env:
          QODER_PRODUCT_ID: qoder
          QODER_AGENT: 'true'
          QUARK_DIR_NAME: 整合包汉化
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
        run: |
          set -euo pipefail
          CLI="$HOME/.pi/agent/skills/quarkclouddrive/scripts/quark-drive.cjs"
          if [ ! -f "$CLI" ]; then
            echo "::error::夸克 CLI 不存在（Install quark CLI 未成功）"
            exit 1
          fi
          export QUARK_CLI="$CLI"
          node scripts/quark-rename.mjs --verify-only

      # 复查结论是「哪些链接要重传」的唯一依据，而报告写在 research/tmp（gitignore），
      # 任务一结束就随沙箱消失。日志里的清单会被 ::error:: 行数限制截断，所以必须存构件。
      - name: Upload quark verify report
        if: always() && inputs.quarkVerifyOnly == true
        uses: actions/upload-artifact@v4
        with:
          name: quark-verify
          path: research/tmp/quark-verify.json
          if-no-files-found: warn
          retention-days: 30
