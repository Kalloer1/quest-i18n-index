name: farm-merge

# 每台主机（serv00 / instabox，名字由 origin/farm/* 自动发现）各自把产物推到自己分支 farm/<host>，
# 永不 push main。本工作流负责把这些分支的增量合进 main：取 delta → 补布局（build-index）
# → 过闸门 → 打包 → 补交付状态并重算站点数据 → 显式提交 → 触发部署。
#
# 为什么 build-index 要跑两次：layout 来自 research/scan-full.tsv 的 format 列，产物是
# research/index-dataset.json；而 release.mjs 与 validate-quests.mjs 都从它取 layout。
# 新合进来的包如果还不在这份索引里，就会被当成「分离布局」——内嵌包要么假绿要么误红。
#
# 为什么不在主机上直接 push main：主机上只有只读 deploy key（1 把），
# 也没法跑 npm 全套校验；而且三台同时 push main 必然互相顶掉。
#
# 为什么**不用** `push: branches: ['farm/**']` 触发（2026-10-23 实测踩到）：
# push 事件用的是「被推那条分支里」的 workflow 文件。farm 分支是从某一刻的 main 切出来的，
# 之后 main 上的 workflow 修复永远不会自动流进去 —— 结果就是「改好了 main、push 上去
# 却仍然按旧版报错」。schedule 与 workflow_dispatch 永远读默认分支的 workflow，不受这个影响。
# 代价是合并最多滞后一个调度周期（15 分钟），而主机本身也是每 20 包 / 20 分钟才推一次，
# 这个滞后相对整批耗时可忽略。
#
# 夸克网盘镜像已剪出（2026-10-24）：同一条流水线里的镜像旁路失败（登录态过期、报告文件
# 不存在、840s 超时）把整条 run 判成红的，日志里看不出到底谁坏了。Phase 4 会以独立
# 工作流 quark-sync.yml 重生（增量上传 + 分批建链），本工作流只管合并与发布。
on:
  # 定时合并已于 2026-10-23 19:45 停用，改由本机 `npm run publish` 一次性合并发布。
  # 要开回来就把下面三行取消注释（`schedule:` 不能只留注释：GitHub 会把空的 schedule
  # 当非法工作流，push 时刷一堆 0 秒失败的 run，日志里什么都没有，只会污染历史）。
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      hosts:
        description: '逗号分隔的主机名（留空 = 所有 farm/* 分支）'
        required: false
        default: ''
        type: string
      maxPacks:
        description: '单轮最多合并多少个包（默认 80；超出按 slug 字典序截断，其余留待下一轮）'
        required: false
        default: '80'
        type: string
      dryRun:
        description: '只计算增量并输出摘要，不落盘、不提交'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则 dispatch 端点 403）
  actions: write

# 与 deploy.yml 共用 concurrency 组：两者都会写仓库。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # 主要成本是拉 blob；给足余量，避免慢网被误杀。
    timeout-minutes: 350
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # 只有 main 的 depth=1：farm 分支下面单独按需拉，不能跟着一起下。
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare workspace
        run: |
          echo "FARM_DIR=$RUNNER_TEMP/farm" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/farm"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 为什么是 --filter=blob:none + --depth=1：
      # 每条 farm/<host> 分支的 tip 树都带数百 MB（patches/ 全量 + research/packs/*.tar.gz），
      # 老实的 depth=1 同样会把树里所有 blob 全下下来，8 台加起来单次就要拉好几 GB。
      # blobless 只取 commit + tree（几 MB），随后 git checkout <ref> -- <path> 时才按路径
      # 按需拉那几个 blob；本轮真正要的通常只有几十个 .snbt 和一两个 tar.gz。
      - name: Fetch farm branches (blobless)
        run: |
          set -euo pipefail
          if git -c gc.auto=0 fetch --no-tags --prune --filter=blob:none --depth=1 \
               origin '+refs/heads/farm/*:refs/remotes/origin/farm/*'; then
            exit 0
          fi
          # 通配 refspec 一条都匹配不上时 git fetch 返回 1（不是警告），
          # 而「分支还没建」是正常的初始状态，不能因此把定时任务刷成红。
          # 用 ls-remote 区分：确实没有分支 → 放行；有分支却 fetch 失败 → 真故障，照常报错。
          if [ "$(git ls-remote --heads origin 'refs/heads/farm/*' | wc -l)" -eq 0 ]; then
            echo "::warning::远端还没有 farm/* 分支，本轮无事可做"
            # 分支被删光时本地会留下旧的 remote-tracking ref，不清理的话下一轮会拿幽灵 tip 去 diff。
            git for-each-ref --format='%(refname)' refs/remotes/origin/farm | xargs -r -n1 git update-ref -d
            exit 0
          fi
          echo "::error::farm 分支存在但 fetch 失败（网络 / 凭据 / 部分克隆不支持）"
          exit 1

      - name: Resolve hosts
        id: hosts
        run: |
          set -euo pipefail
          RAW="${{ inputs.hosts }}"
          if [ -n "$RAW" ]; then
            # 手动触发可以只合一台，便于排障时不惊动其他主机。
            LIST=$(printf '%s' "$RAW" | tr ',' ' ')
          else
            LIST=$(git for-each-ref --format='%(refname:lstrip=4)' refs/remotes/origin/farm | sort | tr '\n' ' ')
          fi
          LIST=$(printf '%s' "$LIST" | tr -s ' ' | sed 's/^ //; s/ $//')
          # host 会被直接拼进 `git checkout origin/farm/<h>`、diff 文件名和目录名，
          # 不校验就等于把 `../`、空格、大写之类的输入交给 git。
          # 规则与 scripts/lib/farm-merge.mjs 的 isValidHost 保持一致。
          BAD=""
          for h in $LIST; do
            if [[ ! "$h" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              BAD="$BAD $h"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::hosts 含非法值:$BAD（只允许小写字母/数字开头，后接小写字母、数字或连字符）"
            exit 1
          fi
          # 变量名必须与后面 `for h in $HOSTS` 一致（大写）。GitHub Actions 的环境变量
          # 名区分大小写，写成小写会让下一步在 `set -u` 下直接 "HOSTS: unbound variable"。
          echo "HOSTS=$LIST" >> "$GITHUB_ENV"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          [ -n "$LIST" ] || echo "::warning::远端没有 farm/* 分支，本轮无事可做"

      - name: Compute merge plan
        id: plan
        # 不跳过：没有 farm 分支时也要跑一次，让 outputs.count 明确等于 0，
        # 后续步骤的 `count != '0'` 判断才不会被空字符串放行（会在读 plan.json 时炸）。
        run: |
          set -euo pipefail
          # 必须 two-dot（origin/main origin/farm/<h>），不能用 three-dot：
          # 主机从不追 main，Action 里又只有 --depth=1 的浅历史，两边没有 merge-base，
          # `origin/main...origin/farm/<h>` 会直接 fatal（"no merge base"）。
          # 代价是 two-dot 给出的是两棵树的**全量**差异：别台刚合进 main 的包在这里会显示成 D
          # （看起来是本分支把它删了）。所以必须配 --diff-filter=AM 只认新增/修改，
          # 否则每轮都会把同事刚合进来的产物当成待删项，越合越少。
          # core.quotePath=false：别让 git 把非 ASCII 路径转成 \xxx 转义，否则解析不出 slug。
          for h in $HOSTS; do
            # --no-renames：整树 pathspec 下默认的 rename 检测会把「新增整章文件」
            # 和别处同名的删除配成 R，再被 --diff-filter=AM 滤掉 → 还原清单缺文件 →
            # 闸门误报「缺 N 个键」。2026-10-24 实测 30 个包共缺 166 个文件，全是 R。
            git -c core.quotePath=false diff --name-only --no-renames --diff-filter=AM \
              origin/main "origin/farm/$h" -- patches research/packs > "$FARM_DIR/diff-$h.txt"
          done
          node scripts/lib/farm-merge.mjs --dir "$FARM_DIR" \
            --hosts "$(printf '%s' "$HOSTS" | tr ' ' ',')" \
            --out "$FARM_DIR/plan.json" --github-output "$GITHUB_OUTPUT"

      # 单轮上限：8 台主机同时产出时 delta 可能是几百个包，一轮全吃会把 job 拖过超时。
      # 截断而不是「随机取一部分」：按 slug 字典序取前 N 个 —— 顺序稳定、可重放，
      # 同一个 plan 每次都截出同一批；而且被截掉的包下一轮仍在 diff 里（main 还没合它们），
      # 所以不会饿死，只是排后面。
      # 为什么不按主机轮流取：那需要跨轮记住游标，计划就不再是纯函数，重跑结果会漂。
      - name: Cap packs per run
        id: cap
        run: |
          set -euo pipefail
          if [ ! -f "$FARM_DIR/plan.json" ]; then
            echo "::error::plan.json 不存在（Compute merge plan 未成功），无法确定本轮合并集合"
            exit 1
          fi
          CAP="${{ inputs.maxPacks }}"
          # 非数字或 0 一律退回 80：0 等于「本轮什么都不合」，与 dryRun 语义重叠，
          # 真按 0 截断只会让后面的步骤对着空计划空转，属于误配而不是意图。
          case "$CAP" in ''|*[!0-9]*) CAP=80 ;; esac
          # 10# 前缀强制十进制：直接 `[ 080 -ge 1 ]` 会被当成八进制而报 "value too great for base"。
          CAP=$((10#$CAP))
          [ "$CAP" -ge 1 ] || CAP=80
          CAP="$CAP" node --input-type=module -e '
            import { appendFileSync, readFileSync, writeFileSync } from "node:fs"
            const dir = process.env.FARM_DIR
            const plan = JSON.parse(readFileSync(`${dir}/plan.json`, "utf8"))
            const cap = Number(process.env.CAP)
            const all = Object.keys(plan.bySlug)
            // 只有真的超了才重排：没超时保持 bySlug 的原插入序，避免无谓地改写文件。
            const kept = all.length > cap ? [...all].sort().slice(0, cap) : all
            if (all.length > cap) {
              const keep = new Set(kept)
              const bySlug = {}
              for (const slug of kept) bySlug[slug] = plan.bySlug[slug]
              // conflicts 只留本轮真合并的 slug：被截断的包并没有进 main，
              // 摘要里再写「取了哪台」会让人以为它已经落地了。
              const conflicts = plan.conflicts.filter((c) => keep.has(c.slug))
              // skipped 原样保留：它们是「候选不合格」的包，本来就不在 bySlug 里，
              // 与截断无关；剔掉反而丢掉「这些包为什么一直合不进来」的线索。
              const skipped = plan.skipped
              const byHost = {}
              for (const item of Object.values(bySlug)) byHost[item.branch] = (byHost[item.branch] ?? 0) + 1
              const stats = {
                count: kept.length,
                byHost,
                conflicts: conflicts.length,
                skipped: skipped.length,
              }
              writeFileSync(`${dir}/plan.json`, `${JSON.stringify({ bySlug, conflicts, skipped, stats })}\n`)
              // 摘要那一步在本进程之后才写，把这句话落到文件里交给它统一输出，
              // 免得 Step Summary 出现「先一句截断、再一个标题」的错位。
              writeFileSync(
                `${dir}/trunc-note.txt`,
                `- 本轮截断：**${all.length} → ${kept.length}**，剩余 ${all.length - kept.length} 个留待下一轮（按 slug 字典序）\n`,
              )
              console.log(`[cap] ${all.length} → ${kept.length}（上限 maxPacks=${cap}）`)
            }
            // 本步骤的 $GITHUB_OUTPUT 是独立文件（不能回写 steps.plan 的），
            // 所以下游要拿「截断后」的集合就必须读这里的 count/slugs。
            appendFileSync(process.env.GITHUB_OUTPUT, `count=${kept.length}\nslugs=${kept.join(",")}\n`)
          '

      - name: Check out only the delta
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          # 逐文件 checkout，不整目录覆盖：main 的 patches/<slug>/ 里可能已经有别台合进来的
          # 文件，整目录 checkout 会按本分支的旧树把它们回滚掉。
          # 这里同时把 research/packs/<slug>.tar.gz 基准源落到工作区；顺序很关键：
          # validate-quests 会双读目录与 tar.gz 拿英文键集，基准源没下来就会按「缺基准键集」判红。
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { execFileSync } from "node:child_process"
            const { bySlug } = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
            for (const [slug, item] of Object.entries(bySlug)) {
              const paths = [...item.patchPaths, item.baselinePath].filter(Boolean)
              execFileSync("git", ["checkout", `origin/farm/${item.branch}`, "--", ...paths], { stdio: "inherit" })
              console.log(`[${slug}] ← farm/${item.branch}（${paths.length} 个文件）`)
            }
          '

      # 第一轮 build-index（只补布局）：layout 来自 research/scan-full.tsv 的 format 列
      # （见 scripts/build-index.mjs:311-312），产物是 research/index-dataset.json。
      # 而 release.mjs（打包）与 validate-quests.mjs（闸门）都从 index-dataset 取 layout：
      # 本轮新合进来的包在里面还没有记录 → layout 未知 → 内嵌包被按分离布局打包/校验，
      # 结果不是假绿就是误红。所以必须在闸门和打包之前先补一趟布局。
      # 此刻 downloads/<slug>.zip 还没生成（delivered=false），下一轮再补交付状态。
      - name: Build index (layout pass)
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: node scripts/build-index.mjs

      # 闸门：增量落盘之后、打包之前。npm test 里已经含 build/site 的数据契约测试。
      - name: Run tests
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: npm test

      - name: Validate quest files
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: |
          set -uo pipefail
          # 闸门判红时先「踢掉坏包再校验一次」，而不是整批停摆。
          # 为什么：坏包绝大多数是主机在上一次运行被中断时写出的残包（缺几百到上万个键），
          # 属于个例；为了它把 1,600 个包的合并全部堵住，代价远大于收益 —— 2026-10-23 实测
          # 连续三次合并都因为 2~4 个残包整批变红。踢掉后它们在工作区消失，本轮不打包、
          # 不入库；主机侧因为分支上那份也已被删，下一轮会重新翻译。
          # 注意：这里必须真的把文件从工作区删掉，只加变量不动文件的话，后面的
          # release --package-only 依然会把坏包打成 zip。
          set +e
          OUT=$(node scripts/validate-quests.mjs 2>&1)
          RC=$?
          set -e
          echo "$OUT" | tail -60
          if [ "$RC" -ne 0 ]; then
            BAD=$(printf '%s\n' "$OUT" | grep -oE '✘ patches/[A-Za-z0-9._-]+' | sed 's#.*patches/##' | sort -u | tr '\n' ' ')
            if [ -z "$BAD" ]; then
              echo "::error::闸门变红但解析不出失败包名，按硬失败处理（不要静默放行）"
              exit 1
            fi
            echo "::warning::闸门拦下：$BAD —— 这些包本轮排除，其余继续合并"
            for s in $BAD; do
              git rm -q -r --cached "patches/$s" 2>/dev/null || true
              rm -rf "patches/$s" "research/packs/$s.tar.gz"
            done
            echo "BLOCKED_SLUGS=$BAD" >> "$GITHUB_ENV"
            # 二次校验：剩下的必须全绿；仍红说明不是「个别残包」，这时才该真红。
            node scripts/validate-quests.mjs
          fi

      # 先打包再重算索引：zip 由 release.mjs 产出（幂等，重跑字节相同）。
      # 必须在 layout pass 之后：release.mjs 用 index-dataset 里的 layout 决定 zip 的目录形态。
      - name: Package patches
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          # 闸门那步会把坏包从工作区删掉，这里必须按「目录还在」过滤一遍：
          # release.mjs 对空目录会打出只有一个 README 的空 zip，等于把坏包伪装成已发布。
          # slug 取 cap 步骤的（= 截断后的集合），不能读 steps.plan：那是未截断的全量 delta。
          KEEP=""
          for s in $(printf '%s' "${{ steps.cap.outputs.slugs }}" | tr ',' ' '); do
            if [ -d "patches/$s" ]; then KEEP="$KEEP,$s"; fi
          done
          KEEP=${KEEP#,}
          if [ -z "$KEEP" ]; then
            echo "::warning::本轮没有任何可打包的包（全部被闸门排除）"
            echo "PACKAGE_SLUGS=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PACKAGE_SLUGS=$KEEP" >> "$GITHUB_ENV"
          node scripts/release.mjs --ids "$KEEP" --package-only

      # 汇总各补丁目录下的 `.source.json`（补丁基于哪个上游文件翻译的）。
      # 单写入者：只在 CI 跑，worker 只推自己那个补丁目录，故不会出现并发合并冲突。
      # 必须在 build-site-data 之前完成 —— 站点数据要读这份汇总。
      - name: Collect source versions
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: node scripts/source-versions.mjs

      # 第二轮 build-index（只补交付状态）：此时 downloads/<slug>.zip 已存在 → delivered=true。
      # 两次 build-index 是「先补布局、后补交付状态」，代价只多生成一次 13MB 的 JSON，
      # 换来打包与闸门拿到正确 layout——比在 release/validate 里各自猜布局便宜得多。
      # 索引与站点数据仍须在本轮 zip 落盘之后重算，否则新条目在站点上是「未交付」。
      - name: Rebuild index (delivered pass) and site data
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: |
          node scripts/build-index.mjs
          node scripts/build-site-data.mjs
          node scripts/build-site-html.mjs

      - name: Stage artifacts
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { bySlug } = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
            for (const slug of Object.keys(bySlug)) console.log(slug)
          ' > "$FARM_DIR/slugs.txt"

          # 显式路径 git add（禁止 -A）：main 上还有别的代理在改脚本，-A 会把他们的半成品带进来。
          # 补丁包有两种文件名：旧名 downloads/<slug>.zip、新名 downloads/<slug>_v<version>.zip。
          # 用 glob 一次覆盖；`[ -e "$f" ]` 保证两种形态缺一种时不会因未匹配而报错。
          while IFS= read -r slug; do
            for p in "patches/$slug" "research/packs/$slug.tar.gz"; do
              if [ -e "$p" ]; then git add -- "$p"; fi
            done
            for f in "downloads/$slug.zip" downloads/"$slug"_v*.zip; do
              if [ -e "$f" ]; then git add -- "$f"; fi
            done
          done < "$FARM_DIR/slugs.txt"
          for p in research/index-dataset.json site/data.json research/source-versions.json glossary.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

      - name: Commit and push
        id: commit
        if: inputs.dryRun != true && steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          # 提交说明按主机分布生成，事后翻 git log 能直接看出这一轮是谁贡献的。
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { bySlug } = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
            const byHost = {}
            for (const item of Object.values(bySlug)) byHost[item.branch] = (byHost[item.branch] ?? 0) + 1
            const parts = Object.entries(byHost).sort().map(([h, n]) => `${h} × ${n}`).join(", ")
            console.log(`farm: 合并 ${Object.keys(bySlug).length} 个整合包（${parts}）`)
          ' > "$FARM_DIR/commit-msg.txt"
          git commit -m "$(cat "$FARM_DIR/commit-msg.txt")"
          # 合并期间别的代理/工作流可能也推了 main：rebase 上来再推，别用 force。
          git pull --rebase --autostash origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的 push 不会触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## farm 合并结果"
            if [ ! -f "$FARM_DIR/plan.json" ]; then
              echo ""
              echo "没有 farm/* 分支或未计算增量，本轮无事可做。"
            else
              node --input-type=module -e '
                import { readFileSync } from "node:fs"
                const plan = JSON.parse(readFileSync(process.env.FARM_DIR + "/plan.json", "utf8"))
                const { stats, bySlug, conflicts, skipped } = plan
                console.log(`- 新增/更新：**${stats.count}** 个整合包${stats.count ? `（${Object.keys(bySlug).join("、")}）` : ""}`)
                const dist = Object.entries(stats.byHost).sort().map(([h, n]) => `${h} × ${n}`).join("，")
                console.log(`- 按主机分布：${dist || "无"}`)
                console.log(`- 冲突（取新者，不判失败）：${conflicts.length ? conflicts.map((c) => `\`${c.slug}\`（${c.winning} 胜 ${c.losers.join("/")}）`).join("、") : "无"}`)
                console.log(`- 跳过：${skipped.length ? skipped.map((s) => `\`${s.slug}\` — ${s.reason}`).join("；<br>") : "无"}`)
              '
            fi
            # 截断说明由 Cap packs per run 落成文件：没有截断就没有这个文件，摘要是干净的。
            if [ -s "$FARM_DIR/trunc-note.txt" ]; then
              cat "$FARM_DIR/trunc-note.txt"
            fi
            echo ""
            if [ "${{ inputs.dryRun }}" = "true" ]; then
              echo "> dryRun：未落盘、未提交。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
