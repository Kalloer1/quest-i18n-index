name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# 刻意**不**与 translate.yml / farm-merge.yml 共用 repo-write 组。
# deploy 的 permissions 只有 contents: read，它不写仓库，串行化没有任何收益；
# 而共用一组的代价是真实的：同一时刻只允许一个 pending run，第三个进入就会把
# 第二个 pending 取消 —— 2026-10-23 合并任务每 15 分钟一次、回填又频繁 dispatch，
# 连续三次 deploy 都在 pending 里被挤掉，站点因此停在旧数据上（数据里有版本、
# 线上没有）。deploy 单独成组反而更安全：它读的是哪个 commit 就部署哪个。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 闸门：测试 + 全量任务书校验，必须在构建之前通过。
      # 删掉人工质量确认后，这里是唯一的质量防线。
      - name: Run tests
        run: npm test

      - name: Validate quest files
        run: npm run validate:quests

      - run: npm run build

      # Worker 部署。必须在 pages deploy 之前，否则线上 API 仍是旧版本。
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.worker.toml

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name quest-i18n-index --branch main
