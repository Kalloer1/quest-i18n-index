name: translate

# 站点提交页 → Worker POST /translate → 本工作流。
# inputs.ids 是逗号分隔的整合包 slug 列表（Worker 传入全部「待翻译」条目）。
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '逗号分隔的整合包 slug 列表'
        required: true
        type: string
      models:
        description: '逗号分隔的模型名；留空则用仓库默认（来自管理区勾选，Worker 已对网关列表做白名单校验）'
        required: false
        type: string
        default: ''
      retryFailed:
        description: '是否额外重试「失败」条目（默认否，避免重复烧额度）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则调用 dispatch 端点 403）
  actions: write

# 与 deploy.yml 共用 concurrency 组：两者都会写仓库 / 触发部署。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # 每个整合包在 pipeline 内独立超时；这里给整批留出余量。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline 会写回 patches/ 与 site/data.json，需要可 push 的凭据
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 闸门（写入之前）：先把仓库里已有的产物校验一遍，避免带着历史问题继续产出。
      - name: Run tests
        run: npm test

      - name: Validate existing quest files
        run: npm run validate:quests

      # 下载整合包并把任务书 .snbt 解到 research/packs/<slug>/：
      # pipeline 的 loadPack 只读该目录，而此前没有任何步骤产出它，
      # 于是 Translate 必然以「找不到整合包文件」失败（实跑 run 39165439848 暴露）。
      - name: Prepare packs
        run: node scripts/prepare-pack.mjs --ids "${{ inputs.ids }}"
        env:
          CF_KEY: ${{ secrets.CF_KEY }}

      - name: Translate
        run: node scripts/pipeline.mjs --ids "${{ inputs.ids }}"
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODELS: ${{ inputs.models || secrets.LLM_MODELS || '' }}
          # 免费层（bilibili Index-Translate）是主路，无需 key；FREE_TIER_* 已在 pipeline.mjs 消费。
          FREE_TIER_ENABLED: ${{ secrets.FREE_TIER_ENABLED || '1' }}
          FREE_TIER_BASE_URL: ${{ secrets.FREE_TIER_BASE_URL }}
          FREE_TIER_MODEL: ${{ secrets.FREE_TIER_MODEL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      # 先打包：镜像步骤上传的是 downloads/<slug>.zip，它由 release.mjs 产出。
      # 早先顺序是「先镜像、后打包」，镜像只能看到 downloads/ 里的历史 zip，
      # 本轮新产出一律「找不到补丁包」而留空（恒为空链接）。
      - name: Package patches
        run: node scripts/release.mjs --ids "${{ inputs.ids }}" --package-only

      # 夸克登录态：CI 里没有浏览器，只能把本机已验证的存根写到 CLI 真正读取的位置。
      # 路径必须是 <技能根>/qoder/config.json —— 旧写法 <技能根>/.quarkclouddrive/openclaw/config.json
      # 不生效（实测），会让 CLI 表现为未登录，进而「绿色通过但零链接」。
      - name: Restore quark config
        env:
          QUARK_CONFIG_JSON: ${{ secrets.QUARK_CONFIG_JSON }}
        run: |
          if [ -z "$QUARK_CONFIG_JSON" ]; then
            echo "未提供 QUARK_CONFIG_JSON，跳过"
            exit 0
          fi
          SKILL_DIR="$HOME/.pi/agent/skills/quarkclouddrive"
          mkdir -p "$SKILL_DIR/qoder"
          printf '%s' "$QUARK_CONFIG_JSON" > "$SKILL_DIR/qoder/config.json"
          chmod 600 "$SKILL_DIR/qoder/config.json"
          echo "登录态已写入（$(wc -c < "$SKILL_DIR/qoder/config.json" | tr -d ' ') 字节，内容不打印）"

      # CLI 是 620KB 自包含单文件，超过 secret 的 48KB 上限，也不入库，只能每次从服务端下载。
      # 安装脚本容错（失败只警告、exit 0）：镜像失败只让网盘字段留空，不该卡住翻译发布；
      # 但本步骤容错不等于本轮可以没有夸克 —— Mirror 带 QUARK_REQUIRED=1，末尾会统一判红。
      - name: Install quark CLI
        run: bash scripts/install-quark-cli.sh

      - name: Mirror to Quark
        id: mirror
        # 镜像失败不阻断发布：翻译产物是主要价值，先让它入库；
        # 但「零链接却绿灯」不可接受，故由末尾独立一步统一判红。
        continue-on-error: true
        run: |
          # CLI 装在哪里要显式告诉 mirror.mjs，否则它会认为夸克不可用。
          CLI="$HOME/.pi/agent/skills/quarkclouddrive/scripts/quark-drive.cjs"
          if [ -f "$CLI" ]; then
            export QUARK_CLI="$CLI"
            echo "夸克 CLI：$CLI（$(wc -c < "$CLI" | tr -d ' ') 字节）"
          else
            echo "::warning::夸克 CLI 不存在（Install quark CLI 未成功），本轮跳过镜像。"
          fi
          node scripts/mirror.mjs
        env:
          QODER_PRODUCT_ID: qoder
          QODER_AGENT: 'true'
          QUARK_DIR_NAME: 整合包汉化
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
          # 本轮「必须」完成夸克镜像：有目标待镜像而 CLI 缺失时 mirror.mjs 置退出码 1。
          QUARK_REQUIRED: '1'
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      # 闸门（写入之后）：本次 Translate / Mirror 新写入的产物不在前面那次校验范围内。
      - name: Validate data contract after translate
        run: npm test

      # 重建索引 → 重建站点数据（合并 quark 链接）→ 显式路径 git add → commit → push。
      # 必须走 release.mjs：它把 patches/ 打成 downloads/<slug>.zip，并把 downloads/、
      # research/packs/<slug>、site/data.json、research/quark-mirrors.json、glossary.json
      # 显式入库（禁止 git add -A）。
      # 早先的写法直接 git add patches 是错的：patches/ 是产出输入，站点消费的是 downloads/*.zip。
      # 这里的打包是幂等的（包已在 Package patches 步骤产出过），重跑逐字节相同。
      - name: Package, rebuild site data, commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs --ids "${{ inputs.ids }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的 push 不触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      # 夸克镜像没干成（登录态过期 / CLI 缺失）必须变红，但要在产物入库之后。
      - name: Fail if quark mirror totally failed
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::error::夸克镜像未完成（多为登录态过期，或 CLI 下载/安装失败）。翻译产物已入库；网盘字段为空，需修好后重跑镜像。"
          exit 1
