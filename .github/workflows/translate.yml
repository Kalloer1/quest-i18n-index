name: translate

# 站点提交页 → Worker POST /translate → 本工作流。
# inputs.ids 是逗号分隔的整合包 slug 列表（Worker 传入全部「待翻译」条目）。
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '逗号分隔的整合包 slug 列表'
        required: true
        type: string
      models:
        description: '逗号分隔的模型名；留空则用仓库默认（来自管理区勾选，Worker 已对网关列表做白名单校验）'
        required: false
        type: string
        default: ''
      retryFailed:
        description: '是否额外重试「失败」条目（默认否，避免重复烧额度）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # workflow_dispatch 需要 actions: write（否则调用 dispatch 端点 403）
  actions: write

# 与 deploy.yml 共用 concurrency 组：两者都会写仓库 / 触发部署。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # 每个整合包在 pipeline 内独立超时；这里给整批留出余量。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline 会写回 patches/ 与 site/data.json，需要可 push 的凭据
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      # 闸门（写入之前）：先把仓库里已有的产物校验一遍，避免带着历史问题继续产出。
      - name: Run tests
        run: npm test

      - name: Validate existing quest files
        run: npm run validate:quests

      - name: Translate
        run: node scripts/pipeline.mjs --ids "${{ inputs.ids }}"
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODELS: ${{ inputs.models || secrets.LLM_MODELS || '' }}
          # 免费层优先，失败落自建网关模型池（ADR-0007 已决）
          FREE_TIER_ENABLED: ${{ secrets.FREE_TIER_ENABLED || '1' }}
          FREE_TIER_BASE_URL: ${{ secrets.FREE_TIER_BASE_URL }}
          FREE_TIER_MODEL: ${{ secrets.FREE_TIER_MODEL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      - name: Mirror to Quark
        id: mirror
        # 镜像失败不阻断发布：翻译产物是主要价值，先让它入库；
        # 但「零链接却绿灯」不可接受，故由末尾独立一步统一判红。
        continue-on-error: true
        run: node scripts/mirror.mjs
        env:
          QODER_PRODUCT_ID: qoder
          QODER_AGENT: 'true'
          QUARK_DIR_NAME: 整合包汉化
          QUARK_PARENT_FID: ${{ secrets.QUARK_PARENT_FID }}
          # 本轮「必须」完成夸克镜像：有目标待镜像而 CLI 缺失时 mirror.mjs 置退出码 1。
          QUARK_REQUIRED: '1'
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}

      # 闸门（写入之后）：本次 Translate / Mirror 新写入的产物不在前面那次校验范围内。
      - name: Validate data contract after translate
        run: npm test

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 显式路径，禁止 git add -A（否则会裹入无关文件）
          for p in patches site/data.json glossary.json; do
            [ -e "$p" ] && git add -- "$p"
          done
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "翻译: ${{ inputs.ids }}"
          # 并发保护：先 rebase 再推，失败重试一次。只 rebase，绝不 force push。
          pushed=false
          for attempt in 1 2; do
            if ! git pull --rebase --autostash origin main; then
              echo "rebase 失败（第 ${attempt} 次），原因见上方输出"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if git push; then
              pushed=true
              break
            fi
            echo "push 第 ${attempt} 次失败，重试"
            sleep 5
          done
          if [ "$pushed" = "true" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "push 连续 2 次失败，退出非 0"
            exit 1
          fi

      # GITHUB_TOKEN 的 push 不触发下游 workflow，故推送成功后显式 dispatch deploy。
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      # 夸克镜像没干成（登录态过期 / CLI 缺失）必须变红，但要在产物入库之后。
      - name: Fail if quark mirror totally failed
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::error::夸克镜像未完成（多为登录态过期，或 CLI 下载/安装失败）。翻译产物已入库；网盘字段为空，需修好后重跑镜像。"
          exit 1
